<script>
/* ============ Error reporting (must be first — catches everything below) ============ */

const ERRORS_KEY = 'stopErrors_v1';
let errorsCache = [];
let stopErrorFallbackShown = false;

function loadErrorsLocalFallback(){
  try{ return JSON.parse(localStorage.getItem(ERRORS_KEY)) || []; }catch(e){ return []; }
}

function logError(message, location){
  const current = (function(){ try{ return localStorage.getItem('stopCurrentUser_v1') || 'Unknown'; }catch(e){ return 'Unknown'; } })();
  const entry = {
    message: String(message == null ? 'Unknown error' : message).slice(0, 500),
    location: String(location || '').slice(0, 200),
    username: current,
    timestamp: new Date().toISOString()
  };
  errorsCache.unshift(entry);
  while(errorsCache.length > 100) errorsCache.pop();
  try{ localStorage.setItem(ERRORS_KEY, JSON.stringify(errorsCache)); }catch(e){}
  try{
    if(typeof SYNC_API_BASE !== 'undefined'){
      fetch(`${SYNC_API_BASE}/log/error`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(entry)
      }).catch(()=>{});
    }
  }catch(e){}
}

function showErrorFallback(message){
  if(stopErrorFallbackShown) return; // don't stack multiple overlays from a burst of errors
  stopErrorFallbackShown = true;
  const overlay = document.createElement('div');
  overlay.id = 'stop-error-fallback';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#ECE5D6;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,sans-serif;text-align:center;';
  overlay.innerHTML = `
    <div>
      <div style="font-size:40px;margin-bottom:12px;">⚠️</div>
      <div style="font-family:Georgia,serif;font-size:20px;margin-bottom:8px;color:#2B2A24;">Something went wrong</div>
      <div style="font-size:13px;color:#5B584C;margin-bottom:20px;max-width:280px;">The app hit an unexpected error. Reloading usually fixes it.</div>
      <button id="stop-error-reload-btn" style="background:#727F63;color:#fff;border:none;border-radius:14px;padding:14px 28px;font-size:13px;cursor:pointer;">Reload App</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('stop-error-reload-btn').addEventListener('click', function(){ location.reload(); });
}

window.addEventListener('error', function(event){
  logError(event.message, (event.filename || '') + ':' + (event.lineno || ''));
  showErrorFallback(event.message);
});
window.addEventListener('unhandledrejection', function(event){
  logError(String(event.reason && event.reason.message ? event.reason.message : event.reason), 'unhandled promise rejection');
  showErrorFallback('A background task failed unexpectedly.');
});

/* ---------- Login announcement (shown once right after a successful login) ---------- */

function maybeShowAnnouncement(){
  const data = loadAnnouncement();
  if(!data || !data.enabled || !data.message) return;
  const overlay = document.createElement('div');
  overlay.id = 'stop-announcement-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:99998;background:rgba(43,42,36,0.45);display:flex;align-items:center;justify-content:center;padding:24px;';
  const esc = (s) => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  overlay.innerHTML = `
    <div style="background:#F8F5EC;border-radius:18px;padding:28px 24px;max-width:340px;width:100%;text-align:center;font-family:-apple-system,sans-serif;">
      <div style="font-family:Georgia,serif;font-size:19px;color:#2B2A24;margin-bottom:10px;">${esc(data.title) || 'Announcement'}</div>
      <div style="font-size:14px;color:#5B584C;line-height:1.5;margin-bottom:22px;white-space:pre-wrap;">${esc(data.message)}</div>
      <button id="stop-announcement-ok-btn" style="background:#727F63;color:#fff;border:none;border-radius:14px;padding:12px 32px;font-size:13px;cursor:pointer;">OK</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('stop-announcement-ok-btn').addEventListener('click', function(){ overlay.remove(); });
}

/* ============ Service worker (faster loads + Android install prompt) ============ */

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}

/* ============ Sync backend ============ */
// After deploying the Worker (see the included README), paste its URL below.
// Until then, the app falls back to local-only storage automatically.
const SYNC_API_BASE_RAW = 'https://stop-sync.ryanhultz.workers.dev';
const SYNC_API_BASE = SYNC_API_BASE_RAW.replace(/\/+$/, ''); // trailing slash tolerated either way

let syncStatus = 'unknown'; // 'ok' | 'offline' | 'not-configured'

function isSyncConfigured(){
  return SYNC_API_BASE && !SYNC_API_BASE.includes('REPLACE-WITH-YOUR-WORKER-URL');
}

async function syncGet(key){
  if(!isSyncConfigured()){ syncStatus = 'not-configured'; return null; }
  try{
    const res = await fetch(`${SYNC_API_BASE}/data/${key}`, { cache: 'no-store' });
    if(!res.ok) throw new Error('bad status');
    syncStatus = 'ok';
    return await res.json();
  }catch(e){
    syncStatus = 'offline';
    return null;
  }
}

async function syncPost(key, value){
  if(!isSyncConfigured()) return false;
  if(isDemoUser()) return true; // demo accounts never actually write anything
  try{
    const token = (typeof getActiveAuthToken === 'function') ? getActiveAuthToken() : null;
    const headers = { 'Content-Type': 'application/json' };
    if(token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(`${SYNC_API_BASE}/data/${key}`, {
      method: 'POST',
      headers,
      body: JSON.stringify(value)
    });
    syncStatus = 'ok';
    return res.ok;
  }catch(e){
    syncStatus = 'offline';
    return false;
  }
}

// Same as syncPost, but returns the server's actual status/error instead
// of collapsing everything down to true/false — used anywhere we need to
// tell the person WHY a save failed, not just that it did.
async function syncPostChecked(key, value){
  if(!isSyncConfigured()) return { ok:false, status:0, error:"Sync isn't set up on this device yet." };
  if(isDemoUser()) return { ok:true, status:200, error:null }; // demo accounts never actually write anything
  try{
    const token = (typeof getActiveAuthToken === 'function') ? getActiveAuthToken() : null;
    const headers = { 'Content-Type': 'application/json' };
    if(token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(`${SYNC_API_BASE}/data/${key}`, {
      method: 'POST',
      headers,
      body: JSON.stringify(value)
    });
    syncStatus = 'ok';
    let body = null;
    try{ body = await res.json(); }catch(e){}
    return { ok: res.ok, status: res.status, error: (body && body.error) ? body.error : null };
  }catch(e){
    syncStatus = 'offline';
    return { ok:false, status:0, error:"Couldn't reach the server." };
  }
}

function syncStatusWarningHtml(){
  if(syncStatus === 'ok') return '';
  if(syncStatus === 'not-configured'){
    return `<div class="storage-warning">⚠️ Sync isn't set up yet — running in local-only mode (this device only). See the README for how to connect the shared database.</div>`;
  }
  if(syncStatus === 'offline'){
    return `<div class="storage-warning">⚠️ Can't reach the shared database right now — showing the last synced data for this device. Changes will still save locally.</div>`;
  }
  return '';
}

/* ---- Backup API ---- */

function authHeaders(extra){
  const token = (typeof getActiveAuthToken === 'function') ? getActiveAuthToken() : null;
  const headers = { ...(extra || {}) };
  if(token) headers['Authorization'] = `Bearer ${token}`;
  return headers;
}

// Creates a user, or patches just the given field(s) on an existing one —
// never touches any other user's record. Replaces the old pattern of
// reading the whole user list and writing it all back.
async function upsertUserOnServer(username, fields){
  if(!isSyncConfigured()) return { ok:false, status:0, error:"Sync isn't set up on this device yet." };
  if(isDemoUser()) return { ok:true, status:200, error:null };
  try{
    const res = await fetch(`${SYNC_API_BASE}/users/upsert`, {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ username, ...fields })
    });

// Escapes text before it's inserted into the page, so anything someone
// types — a client name, a product name, a note — always displays as
// plain text and can never be interpreted as HTML/code by the browser.
// Used anywhere user-entered content is shown to OTHER people, not just
// reflected back to whoever typed it into their own form.
function escapeHtml(str){
  if(str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function checkAuthAndRender(trustSession){
  const gate = document.getElementById('auth-gate');
  const current = getCurrentUser();
  const hasToken = !!getSessionToken();
  // Right after a fresh login/signup, the server has already confirmed the
  // account with a signed token — no need to also find it in the (possibly
  // still-catching-up) full user list before trusting it. Everywhere else,
  // still check the list, so an admin removing someone mid-session is caught.
  const isValid = trustSession ? (current && hasToken) : (current && findUser(current));

  if(isValid){
    let loginDate = null;
    try{ loginDate = localStorage.getItem(LOGIN_DATE_KEY); }catch(e){}
    if(loginDate && loginDate !== new Date().toDateString()){
      logActivity(current, 'Session expired (midnight reset)');
      clearCurrentUser();
      gate.classList.remove('hidden');
      renderAuthView();
      return;
    }
    gate.classList.add('hidden');
  } else {
    if(current && !trustSession && !findUser(current)) clearCurrentUser();
    gate.classList.remove('hidden');
    renderAuthView();
  }
}

      });
    }
  } else {
    inner.innerHTML = `
      <div class="auth-eyebrow">The Ledger</div>
      <h2>Log In</h2>

    `;
    document.getElementById('auth-login-btn').addEventListener('click', ()=>{

      attemptLogin(u, p);
    });
    document.getElementById('auth-show-create').addEventListener('click', ()=>{
      authError = ''; authView = 'create'; renderAuthView();
    });
    document.getElementById('auth-show-recover').addEventListener('click', ()=>{
      authError = ''; authView = 'recover'; recoverStep = 'username'; renderAuthView();
    });
    document.getElementById('auth-show-admin').addEventListener('click', openAdmin);
  }
}

async function lookupSecurityQuestion(username){
  if(!username){ authError = 'Enter your username.'; renderAuthView(); return; }
  if(!isSyncConfigured()){
    authError = "Can't check that — sync isn't set up yet on this device.";
    renderAuthView();
    return;
  }
  let result;
  try{
    const res = await fetch(`${SYNC_API_BASE}/auth/security-question`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username })
    });
    result = await res.json();
  }catch(e){
    authError = "Couldn't reach the server. Check your connection and try again.";
    renderAuthView();
    return;
  }
  if(!result || !result.ok){
    authError = (result && result.error) || 'Could not find that account.';
    renderAuthView();
    return;
  }
  recoverUsername = username;
  recoverQuestion = result.question;
  recoverStep = 'answer';
  authError = '';
  renderAuthView();
}

async function submitPasswordRecovery(username, answer, newPassword){
  if(!answer || !newPassword){ authError = 'Fill in both fields.'; renderAuthView(); return; }
  let result;
  try{
    const res = await fetch(`${SYNC_API_BASE}/auth/recover-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, answer, newPassword })
    });
    result = await res.json();
  }catch(e){
    authError = "Couldn't reach the server. Check your connection and try again.";
    renderAuthView();
    return;
  }
  if(!result || !result.ok){
    authError = (result && result.error) || 'Could not reset that password.';
    renderAuthView();
    return;
  }
  logActivity(username, 'Reset password via security question');
  authError = '';
  authView = 'login';
  recoverStep = 'username';
  alert('Password reset. You can log in with your new password now.');
  renderAuthView();
}

async function attemptLogin(username, password){
  if(!username || !password){ authError = 'Enter a username and password.'; renderAuthView(); return; }

  if(!isSyncConfigured()){
    authError = "Can't verify login — sync isn't set up yet on this device. See the README.";
    renderAuthView();
    return;
  }

  let result;
  try{
    const res = await fetch(`${SYNC_API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    result = await res.json();
  }catch(e){
    authError = "Couldn't reach the server. Check your connection and try again.";
    renderAuthView();
    return;
  }

  if(!result || !result.ok){
    authError = (result && result.error) || 'Incorrect username or password.';
    logActivity(username || '(blank)', 'Failed login attempt');
    renderAuthView();
    return;
  }

  setCurrentUser(result.username, result.token);
  logActivity(result.username, 'Logged in');
  authError = '';
  checkAuthAndRender(true);
  maybeShowAnnouncement();
  refreshUsersFromServer();
}

async function attemptCreateAccount(username, password, confirmPw, code, securityQuestion, securityAnswer){
  if(!username || !password || !confirmPw){ authError = 'Fill in all fields.'; renderAuthView(); return; }
  if(password !== confirmPw){ authError = 'Passwords do not match.'; renderAuthView(); return; }

  if(!isSyncConfigured()){
    authError = "Can't create an account — sync isn't set up yet on this device. See the README.";
    renderAuthView();
    return;
  }

  let result;
  try{
    const res = await fetch(`${SYNC_API_BASE}/auth/signup`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, inviteCode: code, securityQuestion, securityAnswer })
    });
    result = await res.json();
  }catch(e){
    authError = "Couldn't reach the server. Check your connection and try again.";
    renderAuthView();
    return;
  }

  if(!result || !result.ok){
    authError = (result && result.error) || 'Could not create that account.';
    renderAuthView();
    return;
  }

  logActivity(username, 'Created account');
  setCurrentUser(result.username, result.token);
  logActivity(result.username, 'Logged in');
  authError = '';
  checkAuthAndRender(true);
  maybeShowAnnouncement();
  refreshUsersFromServer();
}

function logout(){
  const current = getCurrentUser();
  if(current) logActivity(current, 'Logged out');
  clearCurrentUser();
  clearMasterToken();
  adminSessionMode = null;

}

function getEffectiveAdminPermissions(){
  if(adminSessionMode === 'master') return { users:true, protocols:true, products:true, supplies:true, allergens:true, activity:true };
  const current = getCurrentUser();
  const user = current ? findUser(current) : null;
  return getUserPermissions(user);
}

function getAdminActingUsername(){
  const current = getCurrentUser();
  if(adminSessionMode === 'master'){
    return current ? `${current} (master access)` : 'Master Management';
  }
  return current || 'Unknown';
}

function openAdmin(){
  adminTab = null;
  const current = getCurrentUser();
  const user = current ? findUser(current) : null;
  const perms = getUserPermissions(user);
  const hasAnyPermission = PERMISSION_KEYS.some(k => perms[k]);

  if(hasAnyPermission){
    adminSessionMode = 'user';
    adminUnlocked = true;
  } else {
    adminSessionMode = null;
    adminUnlocked = false;
  }
  renderAdmin();
  document.getElementById('admin-overlay').classList.add('open');
}
function closeAdmin(){
  document.getElementById('admin-overlay').classList.remove('open');
  adminSessionMode = null;
}

function renderAdmin(){
  const inner = document.getElementById('admin-inner');

  if(!adminUnlocked){
    inner.innerHTML = `
      <button class="back-btn" id="admin-back"><span class="chev">←</span> Back</button>
      <div class="agenda-step">
        <h2>Management</h2>
        <p class="caption">Enter the management password to continue.</p>

        <div class="field"><label>Management Password</label><input type="password" id="admin-password-input"></div>
        <button class="primary-btn" id="admin-unlock-btn">Unlock</button>
      </div>
    `;
    document.getElementById('admin-back').addEventListener('click', closeAdmin);
    const tryUnlock = async ()=>{
      const val = document.getElementById('admin-password-input').value;
      const btn = document.getElementById('admin-unlock-btn');
      if(!isSyncConfigured()){
        document.getElementById('admin-pw-error').innerHTML = `<div class="auth-error">Can't verify — sync isn't set up yet on this device. See the README.</div>`;
        return;
      }
      btn.textContent = 'Checking…';
      let result;
      try{
        const res = await fetch(`${SYNC_API_BASE}/auth/master`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: val })
        });
        result = await res.json();
      }catch(e){
        document.getElementById('admin-pw-error').innerHTML = `<div class="auth-error">Couldn't reach the server. Check your connection.</div>`;
        btn.textContent = 'Unlock';
        return;
      }
      if(result && result.ok){
        setMasterToken(result.token);
        adminUnlocked = true;
        adminSessionMode = 'master';
        renderAdmin();
      } else {
        document.getElementById('admin-pw-error').innerHTML = `<div class="auth-error">${(result && result.error) || 'Incorrect password.'}</div>`;
        btn.textContent = 'Unlock';
      }
    };
    document.getElementById('admin-unlock-btn').addEventListener('click', tryUnlock);
    document.getElementById('admin-password-input').addEventListener('keydown', (e)=>{
      if(e.key === 'Enter') tryUnlock();
    });
    return;
  }

  const perms = getEffectiveAdminPermissions();
  const visibleSections = ADMIN_SECTIONS.filter(s => perms[s.key]);

  if(!adminTab){
    inner.innerHTML = `
      <button class="back-btn" id="admin-back"><span class="chev">←</span> Back</button>
      <div class="agenda-step">
        <h2>Management</h2>
        <p class="caption">Choose a section to manage.</p>
        ${syncStatusWarningHtml()}
        ${visibleSections.length ? `
          <div class="grid">
            ${visibleSections.map(s => `
              <button class="card-btn" data-admin-tab="${s.key}">
                <span>
                  <span class="name">${s.name}</span>
                  <span class="meta">${s.meta}</span>
                </span>
                ${iconArrow()}
              </button>
            `).join('')}
          </div>
        ` : `<p class="caption">Your account doesn't have access to any management sections yet — ask an existing manager to grant access in Management → Users.</p>`}
        <div class="copyright-line">© 2026 Ryan Hultz</div>
      </div>
    `;
    document.getElementById('admin-back').addEventListener('click', closeAdmin);
    inner.querySelectorAll('[data-admin-tab]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        adminTab = btn.dataset.adminTab;
        renderAdmin();
      });
    });
    return;
  }

  if(!perms[adminTab]){
    adminTab = null;
    renderAdmin();
    return;
  }

  const sectionMeta = ADMIN_SECTIONS.find(s => s.key === adminTab);
  inner.innerHTML = `
    <button class="back-btn" id="admin-back"><span class="chev">←</span> Admin</button>
    <div class="agenda-step">
      <h2>${sectionMeta ? sectionMeta.name : 'Management'}</h2>
      ${syncStatusWarningHtml()}
      <div id="admin-tab-content"></div>
    </div>
  `;
  document.getElementById('admin-back').addEventListener('click', ()=>{

  else if(adminTab === 'protocols') renderAdminProtocolsTab();
  else if(adminTab === 'products') renderAdminProductsTab();
  else if(adminTab === 'supplies') renderAdminSuppliesTab();
  else if(adminTab === 'allergens') renderAdminAllergensTab();
  else if(adminTab === 'backup') renderAdminBackupTab();
  else if(adminTab === 'errors') renderAdminErrorsTab();
  else if(adminTab === 'settings') renderAdminSettingsTab();
  else renderAdminActivityTab();
}

function renderAdminUsersList(){
  const content = document.getElementById('admin-tab-content');
  const users = [...loadUsers()].sort((a,b) => a.username.toLowerCase().localeCompare(b.username.toLowerCase()));

  content.innerHTML = `
    <div class="block-label">Add User</div>
    <div class="field"><label>Username</label><input type="text" id="admin-new-username"></div>
    <div class="field"><label>Password</label><input type="text" id="admin-new-password"></div>

    <div class="block-label" style="margin-top:32px;">Users</div>
    <div id="admin-user-list">
      ${users.length ? users.map(u => `
        <button class="user-list-row" data-username="${u.username}">
          <span class="ulr-name">${escapeHtml(u.username)}</span>
          <span class="ulr-meta">${u.lastLogin ? `Last login: ${new Date(u.lastLogin).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}` : 'Never logged in'}</span>
        </button>
      `).join('') : `<p class="caption">No users yet.</p>`}

  `;

  document.getElementById('admin-add-user-btn').addEventListener('click', async ()=>{
    const u = document.getElementById('admin-new-username').value.trim();

    if(!u || !p){ alert('Enter a username and password.'); return; }
    await refreshUsersFromServer();
    if(findUser(u)){ alert('That username already exists.'); return; }
    const result = await upsertUserOnServer(u, { password: p, permissions: blankPermissions() });
    if(!result.ok){
      alert(`Couldn't add the user — the server rejected it (${result.error || 'error ' + result.status}).`);
    } else {
      logActivity(getAdminActingUsername(), `Added user "${u}"`);
    }
    await refreshUsersFromServer();
    renderAdminUsersTab();

  content.querySelectorAll('.user-list-row').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      viewingUserUsername = btn.dataset.username;
      renderAdminUsersTab();
    });
  });

    const username = user.username;
    const newVal = !user.isDemo;
    const result = await upsertUserOnServer(username, { isDemo: newVal });
    if(!result.ok){
      alert(`Couldn't update this — the server rejected it (${result.error || 'error ' + result.status}).`);
    } else {
      logActivity(getAdminActingUsername(), `${newVal ? 'Enabled' : 'Disabled'} demo mode for "${username}"`);
    }
    await refreshUsersFromServer();
    renderAdminUsersTab();
  });
  content.querySelectorAll('.perm-chip').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const username = btn.dataset.username;
      const key = btn.dataset.perm;
      await refreshUsersFromServer();
      const u = findUser(username);
      if(!u) return;
      const updatedPermissions = getUserPermissions(u);
      const newVal = !updatedPermissions[key];
      updatedPermissions[key] = newVal;
      const result = await upsertUserOnServer(username, { permissions: updatedPermissions });
      if(!result.ok){
        alert(`Couldn't update permissions — the server rejected it (${result.error || 'error ' + result.status}).`);
      } else {
        const sectionName = ADMIN_SECTIONS.find(s => s.key === key).name;
        logActivity(getAdminActingUsername(), `${newVal ? 'Granted' : 'Revoked'} "${sectionName}" access for "${username}"`);
      }
      await refreshUsersFromServer();
      renderAdminUsersTab();
    });
  });
  content.querySelector('.admin-reset-btn').addEventListener('click', async ()=>{
    const username = user.username;
    const newPw = prompt(`New password for ${username}:`);
    if(!newPw) return;
    const result = await upsertUserOnServer(username, { password: newPw });
    if(!result.ok){
      alert(`Couldn't reset the password — the server rejected it (${result.error || 'error ' + result.status}).`);
    } else {
      logActivity(getAdminActingUsername(), `Reset password for "${username}"`);
      alert('Password reset.');
    }
    await refreshUsersFromServer();
    renderAdminUsersTab();
  });
  content.querySelector('.admin-remove-btn').addEventListener('click', async ()=>{
    const username = user.username;
    if(!confirm(`Remove user "${username}"?`)) return;
    const result = await deleteUserOnServer(username);
    if(!result.ok){
      alert(`Couldn't remove the user — the server rejected it (${result.error || 'error ' + result.status}).`);
    } else {
      logActivity(getAdminActingUsername(), `Removed user "${username}"`);
      if(getCurrentUser() === username){ clearCurrentUser(); }
      viewingUserUsername = null;
    }
    await refreshUsersFromServer();
    renderAdminUsersTab();
  });
}

function blankPrepRow(){ return { productId:'', amount:'', originalText:'', isChoice:false, choiceProductIds:[] }; }

function resetProtocolFormRows(editing){
  if(editing && editing.prep && editing.prep.length){
    protocolPrepRows = editing.prep.map(item => {
      if(item.productIds && item.productIds.length){
        return { productId: '', amount: item.amount || '', originalText: '', isChoice: true, choiceProductIds: [...item.productIds] };
      }
      if(item.productId){
        return { productId: item.productId, amount: item.amount || '', originalText: '', isChoice: false, choiceProductIds: [] };
      }
      return {
        productId: '', amount: '', isChoice: false, choiceProductIds: [],
        originalText: item.note ? `${item.t} (${item.note})` : item.t
      };
    });
  } else {
    protocolPrepRows = [blankPrepRow()];
  }
  if(editing && editing.tableMakeup && editing.tableMakeup.length){
    protocolTableMakeupRows = editing.tableMakeup.map(text => ({
      supplyId: '',
      qty: '',
      originalText: text
    }));
  } else {
    protocolTableMakeupRows = [blankTableMakeupRow()];
  }
}

const PROTOCOL_SECTION_LABELS = { body: 'Body Treatments', kurr: 'Kurr Collection', massages: 'Massages', custom: 'Custom' };

// A protocol counts as a couples treatment if explicitly flagged, or (for
// protocols that predate the flag) if its name clearly says so.
function isCouplesProtocol(p){
  if(!p) return false;
  if(p.couples === true) return true;
  if(p.couples === false) return false;
  return /couples/i.test(p.name) || p.name === 'The Art of Living';
}

let editingSubProtocolId = null;

function renderSubProtocolsSubTab(){
  const el = document.getElementById('subprotocols-content');
  if(!el) return;
  const subProtocols = [...loadSubProtocols()].sort((a,b) => a.name.localeCompare(b.name));
  const editing = editingSubProtocolId ? subProtocols.find(sp => sp.id === editingSubProtocolId) : null;

  el.innerHTML = `
    <p class="caption">A Sub-Protocol is a reusable step-sequence — like the Facial Massage routine — that you can insert into any main Protocol's Steps. Editing or renaming it here updates it everywhere it's used.</p>
    <div class="block-label">${editing ? `Editing "${escapeHtml(editing.name)}"` : 'Add Sub-Protocol'}</div>
    <div class="field"><label>Name</label><input type="text" id="subprotocol-name" value="${editing ? escapeHtml(editing.name) : ''}"></div>
    <div class="field"><label>Steps (one per line)</label><textarea id="subprotocol-steps" rows="6">${editing && editing.steps ? escapeHtml(editing.steps.join('\n')) : ''}</textarea></div>
    <button class="primary-btn" id="save-subprotocol-btn">${editing ? 'Save Changes' : 'Add Sub-Protocol'}</button>
    ${editing ? `<button class="ghost-btn" id="cancel-subprotocol-btn">Cancel Edit</button>` : ''}

    <div class="block-label" style="margin-top:32px;">Sub-Protocols</div>
    ${subProtocols.length ? subProtocols.map(sp => `
      <div class="admin-user-row">
        <div class="admin-user-name">${escapeHtml(sp.name)}<span class="admin-supply-empty" style="display:block;font-size:11px;margin-top:2px;">${(sp.steps||[]).length} step${(sp.steps||[]).length===1?'':'s'}</span></div>
        <div class="admin-user-actions">
          <button class="ghost-btn edit-subprotocol-btn" data-id="${sp.id}">Edit</button>
          <button class="ghost-btn remove-subprotocol-btn" data-id="${sp.id}">Remove</button>
        </div>
      </div>
    `).join('') : `<p class="caption">No Sub-Protocols yet.</p>`}
  `;

  document.getElementById('save-subprotocol-btn').addEventListener('click', ()=>{
    const name = document.getElementById('subprotocol-name').value.trim();
    const stepsText = document.getElementById('subprotocol-steps').value;
    const steps = stepsText.split('\n').map(s => s.trim()).filter(Boolean);
    if(!name){ alert('Enter a name.'); return; }
    if(!steps.length){ alert('Enter at least one step.'); return; }
    const list = loadSubProtocols();
    if(editingSubProtocolId){
      const existing = list.find(sp => sp.id === editingSubProtocolId);
      if(existing){
        existing.name = name;
        existing.steps = steps;
        logActivity(getAdminActingUsername(), `Edited Sub-Protocol "${name}"`);
      }
      editingSubProtocolId = null;
    } else {
      list.push({ id: makeId(), name, steps, createdAt: new Date().toISOString() });
      logActivity(getAdminActingUsername(), `Added Sub-Protocol "${name}"`);
    }
    saveSubProtocols(list);
    renderSubProtocolsSubTab();
  });
  const cancelBtn = document.getElementById('cancel-subprotocol-btn');
  if(cancelBtn){
    cancelBtn.addEventListener('click', ()=>{
      editingSubProtocolId = null;
      renderSubProtocolsSubTab();
    });
  }
  el.querySelectorAll('.edit-subprotocol-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingSubProtocolId = btn.dataset.id;
      renderSubProtocolsSubTab();
    });
  });
  el.querySelectorAll('.remove-subprotocol-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const sp = loadSubProtocols().find(s => s.id === btn.dataset.id);
      if(!confirm(`Remove Sub-Protocol "${sp ? sp.name : ''}"? Any protocol steps that reference it will show as not found.`)) return;
      saveSubProtocols(loadSubProtocols().filter(s => s.id !== btn.dataset.id));
      logActivity(getAdminActingUsername(), `Removed Sub-Protocol "${sp ? sp.name : ''}"`);
      renderSubProtocolsSubTab();
    });
  });
}

    <div class="field">

    </div>
    ${loadSubProtocols().length ? `
    <div class="field">
      <label>Insert Sub-Protocol</label>
      <select id="admin-insert-subprotocol-select">
        <option value="">Choose a Sub-Protocol to insert as a step…</option>
        ${loadSubProtocols().map(sp => `<option value="${sp.id}">${sp.name}</option>`).join('')}
      </select>
      <button class="ghost-btn" id="admin-insert-subprotocol-btn" style="margin-top:8px;">Insert at End of Steps</button>

    ` : ''}
    <button class="primary-btn" id="admin-add-protocol-btn">${editing ? 'Save Changes' : 'Add Protocol'}</button>
    ${editing ? `<button class="ghost-btn" id="admin-cancel-edit-btn">Cancel Edit</button>` : ''}

    <div class="block-label" style="margin-top:32px;">All Protocols</div>

      ${protocols.length ? protocols.map(p => `

            <button class="ghost-btn admin-remove-protocol-btn" data-id="${p.id}">Remove</button>
          </div>
        </div>
        <div class="admin-ingredient-tags hidden" id="protocol-preview-${p.id}">
          ${p.caption ? `<span class="ingredient-tag">${p.caption}</span>` : ''}
          ${p.prep ? p.prep.map(pr => `<span class="ingredient-tag">${pr.t}</span>`).join('') : ''}
          ${p.steps ? `<span class="ingredient-tag">${p.steps.length} step${p.steps.length===1?'':'s'}</span>` : ''}
        </div>
      `).join('') : `<p class="caption">No protocols yet.</p>`}
    </div>
  `;

  // Row field changes just update state — no re-render needed
  content.querySelectorAll('.prep-product-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      protocolPrepRows[parseInt(sel.dataset.idx,10)].productId = sel.value;
    });
  });
  content.querySelectorAll('.prep-amount-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      protocolPrepRows[parseInt(sel.dataset.idx,10)].amount = sel.value;
    });
  });
  content.querySelectorAll('.prep-make-choice-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.idx,10);
      protocolPrepRows[idx].isChoice = true;
      if(!protocolPrepRows[idx].choiceProductIds) protocolPrepRows[idx].choiceProductIds = [];
      renderAdminProtocolsTab();
    });
  });
  content.querySelectorAll('.prep-undo-choice-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.idx,10);
      protocolPrepRows[idx].isChoice = false;
      protocolPrepRows[idx].choiceProductIds = [];
      renderAdminProtocolsTab();
    });
  });
  content.querySelectorAll('.prep-choice-checkbox').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const idx = parseInt(cb.dataset.idx,10);
      const row = protocolPrepRows[idx];
      if(!row.choiceProductIds) row.choiceProductIds = [];
      if(cb.checked){
        if(!row.choiceProductIds.includes(cb.dataset.productId)) row.choiceProductIds.push(cb.dataset.productId);
      } else {
        row.choiceProductIds = row.choiceProductIds.filter(id => id !== cb.dataset.productId);
      }
    });
  });
  content.querySelectorAll('.tmu-supply-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      protocolTableMakeupRows[parseInt(sel.dataset.idx,10)].supplyId = sel.value;
    });
  });
  content.querySelectorAll('.tmu-qty-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      protocolTableMakeupRows[parseInt(sel.dataset.idx,10)].qty = sel.value;
    });
  });
  content.querySelectorAll('.remove-row-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.idx,10);
      if(btn.dataset.kind === 'prep'){
        protocolPrepRows.splice(idx,1);
        if(!protocolPrepRows.length) protocolPrepRows.push(blankPrepRow());
      } else {
        protocolTableMakeupRows.splice(idx,1);
        if(!protocolTableMakeupRows.length) protocolTableMakeupRows.push(blankTableMakeupRow());
      }
      renderAdminProtocolsTab();
    });
  });
  document.getElementById('add-prep-row-btn').addEventListener('click', ()=>{
    protocolPrepRows.push(blankPrepRow());
    renderAdminProtocolsTab();
  });
  document.getElementById('add-tmu-row-btn').addEventListener('click', ()=>{
    protocolTableMakeupRows.push(blankTableMakeupRow());
    renderAdminProtocolsTab();
  });
  content.querySelectorAll('[data-protocols-subtab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ protocolsSubView = btn.dataset.protocolsSubtab; renderAdminProtocolsTab(); });
  });
  const insertSubBtn = document.getElementById('admin-insert-subprotocol-btn');
  if(insertSubBtn){
    insertSubBtn.addEventListener('click', ()=>{
      const select = document.getElementById('admin-insert-subprotocol-select');
      const sp = loadSubProtocols().find(s => s.id === select.value);
      if(!sp){ alert('Choose a Sub-Protocol first.'); return; }
      const textarea = document.getElementById('admin-new-protocol-steps');
      const marker = subProtocolMarker(sp);
      const start = textarea.selectionStart != null ? textarea.selectionStart : textarea.value.length;
      const end = textarea.selectionEnd != null ? textarea.selectionEnd : textarea.value.length;
      const before = textarea.value.slice(0, start);
      const after = textarea.value.slice(end);
      const needsLeadingNewline = before.length > 0 && !before.endsWith('\n');
      const needsTrailingNewline = after.length > 0 && !after.startsWith('\n');
      const insertText = (needsLeadingNewline ? '\n' : '') + marker + (needsTrailingNewline ? '\n' : '');
      textarea.value = before + insertText + after;
      const newCursorPos = (before + insertText).length;
      textarea.focus();
      textarea.setSelectionRange(newCursorPos, newCursorPos);
      select.value = '';
    });
  }

  document.getElementById('admin-add-protocol-btn').addEventListener('click', ()=>{
    const name = document.getElementById('admin-new-protocol-name').value.trim();
    const caption = document.getElementById('admin-new-protocol-caption').value.trim();
    const section = document.getElementById('admin-new-protocol-section').value;
    const kind = document.getElementById('admin-new-protocol-kind').value;
    const couples = document.getElementById('admin-new-protocol-couples').checked;
    const description = document.getElementById('admin-new-protocol-description').value.trim();
    const calloutsText = document.getElementById('admin-new-protocol-callouts').value;
    const stepsText = document.getElementById('admin-new-protocol-steps').value;

    if(!name){ alert('Enter a protocol name.'); return; }

    const callouts = parseLines(calloutsText);
    const steps = parseLines(stepsText);

    const currentProducts = loadProducts();
    const prep = protocolPrepRows.map(row => {
      if(row.isChoice && row.choiceProductIds && row.choiceProductIds.length){
        const names = row.choiceProductIds
          .map(id => { const p = currentProducts.find(pr => pr.id === id); return p ? p.name : null; })
          .filter(Boolean);
        if(!names.length) return null;
        const label = names.length === 1
          ? names[0]
          : names.length === 2
            ? `${names[0]} or ${names[1]}`
            : `${names.slice(0, -1).join(', ')}, or ${names[names.length - 1]}`;
        const t = row.amount ? `${row.amount} — ${label} (guest's choice)` : `${label} (guest's choice)`;
        return { t, productIds: row.choiceProductIds, amount: row.amount || '' };
      } else if(row.productId){
        const product = currentProducts.find(p => p.id === row.productId);
        const productName = product ? product.name : '';
        const t = row.amount ? `${row.amount} ${productName}` : productName;
        return t ? { t, productId: row.productId, amount: row.amount || '' } : null;
      } else if(row.originalText){
        return { t: row.originalText };
      }
      return null;
    }).filter(Boolean);

    const currentSupplies = loadSupplies();
    const tableMakeup = protocolTableMakeupRows.map(row => {
      if(row.supplyId){
        const supply = currentSupplies.find(s => s.id === row.supplyId);
        const supplyName = supply ? supply.name : '';
        const t = row.qty ? `${row.qty} ${supplyName}` : supplyName;
        return t || null;
      } else if(row.originalText){
        return row.originalText;
      }
      return null;
    }).filter(Boolean);

    const list = loadCustomProtocols();

    if(editingProtocolId){
      const existing = list.find(p => p.id === editingProtocolId);
      if(existing){
        existing.name = name;
        existing.caption = caption || '';
        existing.section = section;
        existing.kind = kind;
        existing.couples = couples;
        if(description) existing.menuDescription = description; else delete existing.menuDescription;
        if(callouts.length) existing.callouts = callouts; else delete existing.callouts;
        if(tableMakeup.length) existing.tableMakeup = tableMakeup; else delete existing.tableMakeup;
        if(prep.length) existing.prep = prep; else delete existing.prep;
        if(steps.length) existing.steps = steps; else delete existing.steps;
        saveCustomProtocols(list);
        logActivity(getAdminActingUsername(), `Edited protocol "${name}"`);
      }
      editingProtocolId = null;
    } else {
      const protocol = {
        id: makeId(),
        name,
        caption: caption || '',
        section,
        kind,
        couples,
        createdAt: new Date().toISOString()
      };
      if(description) protocol.menuDescription = description;
      if(callouts.length) protocol.callouts = callouts;
      if(tableMakeup.length) protocol.tableMakeup = tableMakeup;
      if(prep.length) protocol.prep = prep;
      if(steps.length) protocol.steps = steps;
      list.push(protocol);
      saveCustomProtocols(list);
      logActivity(getAdminActingUsername(), `Added protocol "${name}"`);
    }
    protocolFormTarget = null; // force a fresh, blank row-builder state next render
    renderAdminProtocolsTab();
  });

  const cancelBtn = document.getElementById('admin-cancel-edit-btn');
  if(cancelBtn){
    cancelBtn.addEventListener('click', ()=>{
      editingProtocolId = null;
      renderAdminProtocolsTab();
    });
  }

  content.querySelectorAll('.admin-product-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const panel = document.getElementById(`protocol-preview-${btn.dataset.id}`);
      if(panel) panel.classList.toggle('hidden');
    });
  });
  content.querySelectorAll('.admin-edit-protocol-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingProtocolId = btn.dataset.id;
      renderAdminProtocolsTab();
      content.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  content.querySelectorAll('.admin-remove-protocol-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const protocol = loadCustomProtocols().find(p => p.id === id);
      if(!confirm(`Remove protocol "${protocol ? protocol.name : ''}"?`)) return;
      const list = loadCustomProtocols().filter(p => p.id !== id);
      saveCustomProtocols(list);
      logActivity(getAdminActingUsername(), `Removed protocol "${protocol ? protocol.name : id}"`);
      if(editingProtocolId === id) editingProtocolId = null;
      renderAdminProtocolsTab();
    });
  });
}

      renderSettingsCategoriesSubTab();

  });

async function loadBackupListIntoTab(){
  const listEl = document.getElementById('admin-backup-list');
  if(!listEl) return;
  const backups = await fetchBackupList();
  if(!document.getElementById('admin-backup-list')) return; // navigated away while loading

  if(backups === null){
    listEl.innerHTML = `<p class="caption">Couldn't load backups — check your connection.</p>`;
    return;
  }
  if(!backups.length){
    listEl.innerHTML = `<p class="caption">No backups yet. Tap "Back Up Now" to create one.</p>`;
    return;
  }

  listEl.innerHTML = backups.map(b => `
    <div class="admin-user-row">
      <div class="admin-user-name">
        ${b.timestamp ? new Date(b.timestamp).toLocaleString([], {month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit'}) : b.key}
        <span class="admin-supply-empty" style="display:block;font-size:11px;margin-top:2px;">${b.type === 'auto' ? 'Automatic' : 'Manual'}</span>
      </div>
      <div class="admin-user-actions">
        <button class="ghost-btn admin-restore-backup-btn" data-key="${b.key}">Restore</button>
        <button class="ghost-btn admin-delete-backup-btn" data-key="${b.key}">Delete</button>
      </div>
    </div>
  `).join('');

  listEl.querySelectorAll('.admin-restore-backup-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm("Restore this backup? This overwrites ALL current data — users, protocols, products, supplies, and allergens — with this backup's version. This cannot be undone.")) return;
      btn.textContent = 'Restoring…';
      const result = await restoreBackupByKey(btn.dataset.key);
      if(result && result.ok){
        logActivity(getAdminActingUsername(), `Restored backup from ${btn.dataset.key}`);
        await Promise.all([
          refreshUsersFromServer(), refreshActivityFromServer(), refreshProductsFromServer(),
          refreshSuppliesFromServer(), refreshCustomProtocolsFromServer(), refreshAllergensFromServer(),
          refreshRoomsFromServer(), refreshDurationsFromServer(), refreshCategoriesFromServer(), refreshHomeLinksFromServer(),
          refreshSubProtocolsFromServer(), refreshShiftTemplatesFromServer()
        ]);
        renderHomeScheduleList();
        renderHomeLinks();
        checkAuthAndRender();
        alert('Backup restored — data has been refreshed.');
        renderAdminBackupTab();
      } else {
        alert((result && result.error) || 'Restore failed — check your connection.');
        btn.textContent = 'Restore';
      }
    });
  });
  listEl.querySelectorAll('.admin-delete-backup-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Delete this backup? This cannot be undone.')) return;
      const result = await deleteBackupByKey(btn.dataset.key);
      if(result && result.ok){
        logActivity(getAdminActingUsername(), `Deleted backup ${btn.dataset.key}`);
        loadBackupListIntoTab();
      } else {
        alert((result && result.error) || 'Delete failed — check your connection.');
      }
    });
  });
}

let editingProductId = null;

// A Product or Supply is "low stock" only when BOTH a current quantity and
// a reorder threshold have actually been set — leaving either blank means
// this item simply isn't being tracked, not that it's silently at zero.
function isLowStock(item){
  return item.quantity !== undefined && item.quantity !== null
      && item.reorderThreshold !== undefined && item.reorderThreshold !== null
      && item.quantity <= item.reorderThreshold;
}

  const editing = editingProductId ? products.find(p => p.id === editingProductId) : null;

    <div class="field"><label>Reorder At (optional)</label><input type="number" id="admin-new-product-reorder" min="0" step="1" placeholder="Flag as low stock at or below this number" value="${editing && editing.reorderThreshold !== undefined && editing.reorderThreshold !== null ? editing.reorderThreshold : ''}"></div>
    <button class="primary-btn" id="admin-add-product-btn">${editing ? 'Save Changes' : 'Add Product'}</button>
    ${editing ? `<button class="ghost-btn" id="admin-cancel-product-btn">Cancel Edit</button>` : ''}

    <div class="block-label" style="margin-top:32px;">Products</div>
    ${products.filter(isLowStock).length ? `<p class="caption" style="color:#8C4A2A;">${products.filter(isLowStock).length} product${products.filter(isLowStock).length===1?'':'s'} need reordering</p>` : ''}
    <div id="admin-product-list">
      ${products.length ? products.map(p => `
        <div class="admin-supply-row product-row">
          <button class="admin-product-toggle" data-id="${p.id}">
            <span class="admin-user-name">${escapeHtml(p.name)}${p.brand ? ` <span class="admin-supply-empty">— ${escapeHtml(p.brand)}</span>` : ''}${isLowStock(p) ? ` <span class="reorder-badge">Reorder</span>` : ''}</span>
            <span class="tap-hint">${p.quantity !== undefined && p.quantity !== null ? `In stock: ${p.quantity}` : ''}${p.quantity !== undefined && p.quantity !== null && p.ingredients && p.ingredients.length ? ' · ' : ''}${p.ingredients && p.ingredients.length ? 'Tap for ingredients' : (p.quantity !== undefined && p.quantity !== null ? '' : 'No ingredients listed')}</span>
          </button>
          <div class="admin-user-actions">
            <button class="ghost-btn admin-edit-product-btn" data-id="${p.id}">Edit</button>
            <button class="ghost-btn admin-remove-product-btn" data-id="${p.id}">Remove</button>
          </div>
        </div>
        <div class="admin-ingredient-tags hidden" id="ingredients-${p.id}">
          ${p.description ? `<p style="font-size:13px; line-height:1.5; color:var(--ink); margin:0 0 12px;">${escapeHtml(p.description)}</p>` : ''}
          ${p.ingredients && p.ingredients.length
            ? `<div class="ingredient-plain-list">${[...p.ingredients].sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase())).map(i => `<div class="ingredient-plain-item">${escapeHtml(i)}</div>`).join('')}</div>`
            : ''}
        </div>
      `).join('') : `<p class="caption">No products yet.</p>`}
    </div>
  `;

  document.getElementById('admin-add-product-btn').addEventListener('click', ()=>{
    const brand = document.getElementById('admin-new-product-brand').value.trim();
    const name = document.getElementById('admin-new-product-name').value.trim();
    const description = document.getElementById('admin-new-product-description').value.trim();
    const ingredientsText = document.getElementById('admin-new-product-ingredients').value;
    const quantityRaw = document.getElementById('admin-new-product-quantity').value;
    const reorderRaw = document.getElementById('admin-new-product-reorder').value;
    const quantity = quantityRaw === '' ? null : parseInt(quantityRaw, 10);
    const reorderThreshold = reorderRaw === '' ? null : parseInt(reorderRaw, 10);
    if(!name){ alert('Enter a product name.'); return; }
    const ingredients = parseIngredientsText(ingredientsText);
    const list = loadProducts();
    if(editingProductId){
      const existing = list.find(p => p.id === editingProductId);
      if(existing){
        existing.brand = brand;
        existing.name = name;
        existing.description = description;
        existing.ingredients = ingredients;
        existing.quantity = quantity;
        existing.reorderThreshold = reorderThreshold;
        saveProducts(list);
        logActivity(getAdminActingUsername(), `Edited product "${name}"`);
      }
      editingProductId = null;
    } else {
      list.push({ id: makeId(), brand, name, description, ingredients, quantity, reorderThreshold, createdAt: new Date().toISOString() });
      saveProducts(list);
      logActivity(getAdminActingUsername(), `Added product "${name}"`);
    }
    renderAdminProductsTab();
  });
  const cancelProductBtn = document.getElementById('admin-cancel-product-btn');
  if(cancelProductBtn){
    cancelProductBtn.addEventListener('click', ()=>{
      editingProductId = null;
      renderAdminProductsTab();
    });
  }
  content.querySelectorAll('.admin-product-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const panel = document.getElementById(`ingredients-${btn.dataset.id}`);
      if(panel) panel.classList.toggle('hidden');
    });
  });
  content.querySelectorAll('.admin-edit-product-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingProductId = btn.dataset.id;
      renderAdminProductsTab();
      content.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  content.querySelectorAll('.admin-remove-product-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const product = loadProducts().find(p => p.id === id);
      if(!confirm(`Remove product "${product ? product.name : ''}"?`)) return;
      const list = loadProducts().filter(p => p.id !== id);
      saveProducts(list);
      logActivity(getAdminActingUsername(), `Removed product "${product ? product.name : id}"`);
      if(editingProductId === id) editingProductId = null;
      renderAdminProductsTab();
    });
  });
}

    <div id="admin-supply-list">

    const list = loadSupplies();
    list.push({ id: makeId(), name, createdAt: new Date().toISOString() });

    logActivity(getAdminActingUsername(), `Added supply "${name}"`);
    renderAdminSuppliesTab();
  });

      const qtyRaw = content.querySelector(`.supply-quantity-input[data-id="${id}"]`).value;

      supply.reorderThreshold = reorderRaw === '' ? null : parseInt(reorderRaw, 10);
      saveSupplies(list);
      logActivity(getAdminActingUsername(), `Updated stock for "${supply.name}"`);
      renderAdminSuppliesTab();
    });
  });
  content.querySelectorAll('.admin-remove-supply-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const supply = loadSupplies().find(s => s.id === id);
      if(!confirm(`Remove supply "${supply ? supply.name : ''}"?`)) return;
      const list = loadSupplies().filter(s => s.id !== id);
      saveSupplies(list);
      logActivity(getAdminActingUsername(), `Removed supply "${supply ? supply.name : id}"`);
      renderAdminSuppliesTab();
    });
  });
}

// Service and Enhancement options are no longer a separate hardcoded
// list — they're pulled live from Protocols, grouped by Section, and
// filtered by the Full Treatment / Enhancement classification set in
// Management → Protocols. Adding or renaming a protocol there is
// immediately reflected here, with nothing to keep in sync by hand.
function getServiceOptionsFromProtocols(){
  const protocols = loadCustomProtocols().filter(p => (p.kind || 'full') === 'full');
  const groups = {};
  protocols.forEach(p => {
    const groupLabel = getCategoryLabel(p.section);
    if(!groups[groupLabel]) groups[groupLabel] = [];
    groups[groupLabel].push(p.name);
  });
  Object.keys(groups).forEach(g => groups[g].sort((a,b)=>a.localeCompare(b)));
  return groups;
}

function getEnhancementOptionsFromProtocols(){
  const protocols = loadCustomProtocols().filter(p => p.kind === 'enhancement');
  if(!protocols.length) return {};
  return { 'Enhancements': protocols.map(p => p.name).sort((a,b)=>a.localeCompare(b)) };
}

function formatSlotTime(minutes){
  const h24 = Math.floor(minutes/60), min = minutes%60;
  const ampm = h24 < 12 ? 'AM' : 'PM';
  let h12 = h24 % 12; if(h12 === 0) h12 = 12;
  return `${h12}:${min.toString().padStart(2,'0')} ${ampm}`;
}

function buildSlots(startMin, endMin){
  const slots = [];
  let t = startMin;
  while(t + 50 <= endMin){
    slots.push({time:t, client:'', client2:'', service:'', enhancement:'', room:'', duration:shortestConfiguredDuration(), hidden:false});
    t += 60;
  }
  return slots;
}

/* ---------- Paste-to-schedule parsing ---------- */

function timeStringToMinutes(t){
  const m = t.match(/(\d{1,2}):(\d{2})\s*([ap]m)/i);
  if(!m) return null;
  let h = parseInt(m[1],10);
  const min = parseInt(m[2],10);
  const ap = m[3].toLowerCase();
  if(ap === 'pm' && h !== 12) h += 12;
  if(ap === 'am' && h === 12) h = 0;
  return h*60 + min;
}

function parsePastedSchedule(text){
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const timeRangeRe = /^(\d{1,2}:\d{2}\s*[ap]m)\s*-\s*(\d{1,2}:\d{2}\s*[ap]m)$/i;
  const standaloneTimeRe = /^(\d{1,2}:\d{2}\s*[ap]m)$/i;
  const serviceLineRe = /^(.+?)\s+(\d+)\s*min$/i;

  const appointments = [];
  const standaloneLabels = [];

  for(let i=0; i<lines.length; i++){
    const line = lines[i];
    const rangeMatch = line.match(timeRangeRe);
    if(rangeMatch){
      const startMin = timeStringToMinutes(rangeMatch[1]);
      const endMin = timeStringToMinutes(rangeMatch[2]);
      const nameLine = lines[i+1];
      const serviceLine = lines[i+2];
      if(nameLine && serviceLine && startMin !== null && endMin !== null){
        const svcMatch = serviceLine.match(serviceLineRe);
        if(svcMatch){
          let dur = endMin - startMin;
          if(dur <= 0) dur += 24*60;
          appointments.push({
            startMin,
            duration: closestConfiguredDuration(dur),
            client: nameLine,
            serviceText: svcMatch[1].trim()
          });
          i += 2;
          continue;
        }
      }
    }
    if(standaloneTimeRe.test(line)){
      standaloneLabels.push(timeStringToMinutes(line));
    }
  }
  return { appointments, standaloneLabels };
}

const MATCH_STOPWORDS = new Set(['to','be','the','of','a','an','and']);

function normalizeServiceWords(str){
  return str.toLowerCase()
    .replace(/[-–—]/g, ' ')
    .replace(/[^a-z0-9\s]/g, '')
    .split(/\s+/)
    .filter(w => w && !MATCH_STOPWORDS.has(w));
}

function matchServiceName(extractedText){
  const extractedWords = normalizeServiceWords(extractedText);
  if(!extractedWords.length) return '';
  let best = '', bestScore = 0;
  Object.values(getServiceOptionsFromProtocols()).flat().forEach(candidate => {
    const candWords = normalizeServiceWords(candidate);
    const overlap = extractedWords.filter(w => candWords.includes(w)).length;
    const score = overlap / extractedWords.length;
    if(score > bestScore){ bestScore = score; best = candidate; }
  });
  return bestScore >= 0.5 ? best : '';
}

function buildAgendaFromPastedText(text){
  const { appointments, standaloneLabels } = parsePastedSchedule(text);
  if(!appointments.length){
    alert("Couldn't find any appointments in that text. Make sure you copied the full schedule block, including times, names, and services.");
    return false;
  }

  const apptStarts = appointments.map(a => a.startMin);
  const start = Math.min(...apptStarts);

  let end = Math.max(...appointments.map(a => a.startMin + a.duration));
  end = Math.max(end, Math.max(...apptStarts) + 60);

  if(standaloneLabels.length){
    const maxLabel = Math.max(...standaloneLabels);
    let diff = (maxLabel - start) % 60;
    if(diff < 0) diff += 60;
    const aligned = diff === 0 ? maxLabel : maxLabel + (60 - diff);
    end = Math.max(end, aligned + 60);
  }

  const slots = buildSlots(start, end);
  let unmatchedCount = 0;

  appointments.forEach(appt => {
    const idx = slots.findIndex(s => s.time === appt.startMin);
    if(idx === -1) return;
    const matched = matchServiceName(appt.serviceText);
    if(!matched) unmatchedCount++;
    slots[idx].client = appt.client;
    slots[idx].service = matched;
    slots[idx].duration = appt.duration;
    if(appt.duration > shortestConfiguredDuration() && slots[idx+1]){
      slots[idx+1].hidden = true;
    }
  });

  agenda.slots = slots;
  agenda.step = 'fill';
  saveAgendaState();

  if(unmatchedCount > 0){
    alert(`Imported ${appointments.length} appointment${appointments.length===1?'':'s'}. ${unmatchedCount} service${unmatchedCount===1?'':'s'} couldn't be auto-matched — please check and select manually.`);
  }
  return true;
}

  slots:[],

const AGENDA_STORAGE_KEY = 'spaAgendaState_v1';

function storageAvailable(){
  try{
    const testKey = '__storage_test__';
    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);
    return true;
  }catch(e){
    return false;
  }
}

const STORAGE_OK = storageAvailable();

function saveAgendaState(){
  try{
    localStorage.setItem(AGENDA_STORAGE_KEY, JSON.stringify({
      step: agenda.step,
      slots: agenda.slots
    }));
  }catch(e){ /* storage unavailable — continue without persistence */ }
  renderHomeScheduleList();
}

function restoreAgendaState(){
  try{
    const raw = localStorage.getItem(AGENDA_STORAGE_KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(parsed && Array.isArray(parsed.slots) && parsed.slots.length){
      agenda.slots = parsed.slots;
      agenda.step = (parsed.step === 'fill' || parsed.step === 'agenda') ? parsed.step : 'fill';
    }
  }catch(e){ /* corrupt or unavailable storage — start fresh */ }
}

      ${visible.map(s => {
        const svcLine = [s.service, s.enhancement].filter(Boolean).join(' + ');
        const clientLine = [s.client, s.client2].filter(Boolean).join(' & ') || 'Open';
        const isCurrent = current && s.time === current.time;
        return `<div class="agenda-row ${isCurrent ? 'current' : ''}">

/* ---------- Allergy Lookup ---------- */

function extractBotanicalKey(text){
  const idx = text.indexOf('(');
  if(idx === -1) return text.trim().toLowerCase();
  return text.slice(0, idx).trim().toLowerCase();
}

function extractCommonNameFromText(text){
  const m = text.match(/\(([^)]+)\)/);
  return m ? m[1].trim() : '';
}

function getMergedAllergenList(){
  const products = loadProducts();
  const manual = loadAllergens();

  // Step 1: group every raw ingredient variant by its botanical (Latin) key —
  // e.g. "Lavandula Angustifolia (Lavender) Oil" and "...Flower Extract"
  // and the plain "...(Lavender)" all share the botanical key
  // "lavandula angustifolia", so they group together automatically.
  const groups = new Map(); // botanicalKey -> { variants:Set<string>, commonName:string, manualId:string|null }

  products.forEach(p => (p.ingredients || []).forEach(ing => {
    const text = ing.trim();
    if(!text) return;
    const key = extractBotanicalKey(text);
    if(!groups.has(key)){
      groups.set(key, { variants: new Set(), commonName: extractCommonNameFromText(text), manualId: null });
    }
    groups.get(key).variants.add(text.toLowerCase());
  }));

  // Step 2: apply manual common-name assignments. An admin only needs to
  // alias ONE variant (or just the plain botanical name) and it now applies
  // to every variant sharing that botanical key.
  manual.forEach(a => {
    if(!a.fullName) return;
    const key = extractBotanicalKey(a.fullName.trim());
    if(groups.has(key)){
      const g = groups.get(key);
      g.commonName = a.commonName || g.commonName;
      g.manualId = a.id;
    } else {
      // Pure manual addition not tied to any product ingredient yet
      groups.set(key, { variants: new Set([a.fullName.trim().toLowerCase()]), commonName: a.commonName || '', manualId: a.id });
    }
  });

  // Step 3: fallback merge — if two different botanical keys ended up with
  // the same common name (e.g. a synonym Latin name for the same plant),
  // fold them into one entry.
  const byCommonName = new Map(); // lowercase common name -> merged group
  const noCommonName = [];

  groups.forEach((g, botanicalKey) => {
    const commonKey = (g.commonName || '').trim().toLowerCase();
    if(!commonKey){
      noCommonName.push({ botanicalKey, ...g });
      return;
    }
    if(byCommonName.has(commonKey)){
      const existing = byCommonName.get(commonKey);
      g.variants.forEach(v => existing.variants.add(v));
      if(g.manualId) existing.manualId = g.manualId;
    } else {
      byCommonName.set(commonKey, { botanicalKey, ...g });
    }
  });

  const finalGroups = [...byCommonName.values(), ...noCommonName];

  return finalGroups.map(g => {
    const variantList = Array.from(g.variants);
    // Prefer the shortest variant as the representative full name — usually
    // the plain "Latin (Common)" form without an extra Oil/Extract suffix.
    const representative = variantList.sort((a, b) => a.length - b.length)[0] || g.botanicalKey;
    return {
      id: g.manualId,
      commonName: g.commonName || '',
      fullName: representative,
      matchKeys: variantList
    };
  });
}

function allergenDisplayName(entry){
  if(entry.commonName && entry.fullName && entry.commonName.toLowerCase() !== entry.fullName.toLowerCase()){
    return `${entry.commonName} (${entry.fullName})`;
  }
  return entry.commonName || entry.fullName;
}

function allergenSortKey(entry){
  return (entry.commonName || entry.fullName || '').toLowerCase();
}

function getMatchingProducts(entry){
  const products = loadProducts();
  const searchTerms = new Set((entry.matchKeys || [entry.fullName]).map(s => s.trim().toLowerCase()));
  return products
    .filter(p => (p.ingredients || []).some(ing => searchTerms.has(ing.trim().toLowerCase())))
    .sort((a,b) => a.name.localeCompare(b.name));
}

function getProtocolSafety(entry){
  const products = loadProducts();
  const searchTerms = new Set((entry.matchKeys || [entry.fullName]).map(s => s.trim().toLowerCase()));

  const matchingProductNames = products
    .filter(p => (p.ingredients || []).some(ing => searchTerms.has(ing.trim().toLowerCase())))
    .map(p => p.name.toLowerCase());

  const safe = [];
  const unsafe = [];
  ALL.forEach(protocol => {
    const prepTexts = (protocol.prep || []).map(item => item.t.toLowerCase());
    const isUnsafe = matchingProductNames.some(name => prepTexts.some(t => t.includes(name)));
    if(isUnsafe) unsafe.push(protocol); else safe.push(protocol);
  });
  return { safe, unsafe };
}

const allergyOverlay = document.getElementById('allergy-overlay');
const allergyInner = document.getElementById('allergy-inner');
let allergyStep = 'list'; // 'list' | 'detail'
let allergySelectedKey = null;
let allergySearchTerm = '';

function openAllergyLookup(){
  allergyStep = 'list';
  allergySelectedKey = null;
  allergySearchTerm = '';
  renderAllergyLookup();
  allergyOverlay.classList.add('open');
  allergyOverlay.scrollTop = 0;
}
function closeAllergyLookup(){
  allergyOverlay.classList.remove('open');
}

function renderAllergyLookup(){
  if(allergyStep === 'detail' && allergySelectedKey){
    renderAllergyDetail();
  } else {
    renderAllergyList();
  }
}

function renderAllergyList(){
  const all = getMergedAllergenList();
  const filtered = allergySearchTerm
    ? all.filter(e => allergenDisplayName(e).toLowerCase().includes(allergySearchTerm.toLowerCase()))
    : all;

  filtered.sort((a, b) => allergenSortKey(a).localeCompare(allergenSortKey(b)));

  const groups = {};
  filtered.forEach(entry => {
    const letter = (allergenSortKey(entry)[0] || '#').toUpperCase();
    if(!groups[letter]) groups[letter] = [];
    groups[letter].push(entry);
  });
  const letters = Object.keys(groups).sort();

  allergyInner.innerHTML = `
    <button class="back-btn" id="allergy-back"><span class="chev">←</span> Home</button>
    <div class="agenda-step">
      <h2>Allergy Lookup</h2>
      <p class="caption">Find an ingredient to see which treatments are safe to recommend.</p>
      <div class="field"><input type="text" id="allergy-search" placeholder="Search ingredients…" value="${escapeHtml(allergySearchTerm)}"></div>
      ${letters.length ? `
        <div class="letter-jump">
          ${letters.map(l => `<a href="#allergy-letter-${l}" class="letter-chip">${l}</a>`).join('')}
        </div>
      ` : ''}
      ${letters.length ? letters.map(letter => `
        <div class="section-label" id="allergy-letter-${letter}">${letter}</div>
        <div class="grid">
          ${groups[letter].map(entry => `
            <button class="card-btn allergen-btn" data-key="${allergenSortKey(entry)}">
              <span><span class="name">${escapeHtml(allergenDisplayName(entry))}</span></span>
              ${iconArrow()}
            </button>
          `).join('')}
        </div>
      `).join('') : `<p class="caption">No ingredients yet — add products with ingredients, or add allergens manually in Management → Allergies.</p>`}
    </div>
  `;

  document.getElementById('allergy-back').addEventListener('click', closeAllergyLookup);
  const searchInput = document.getElementById('allergy-search');
  searchInput.addEventListener('input', ()=>{
    allergySearchTerm = searchInput.value;
    renderAllergyList();
    document.getElementById('allergy-search').focus();
    const val = document.getElementById('allergy-search').value;
    document.getElementById('allergy-search').setSelectionRange(val.length, val.length);
  });
  allergyInner.querySelectorAll('.allergen-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      allergySelectedKey = btn.dataset.key;
      allergyStep = 'detail';
      renderAllergyLookup();
    });
  });
}

function renderAllergyDetail(){
  const all = getMergedAllergenList();
  const entry = all.find(e => allergenSortKey(e) === allergySelectedKey);
  if(!entry){
    allergyStep = 'list';
    renderAllergyList();
    return;

  const { safe, unsafe } = getProtocolSafety(entry);
  const matchingProducts = getMatchingProducts(entry);

  allergyInner.innerHTML = `

function generateSoapPdf(){
  const draft = loadSoapDraft();
  const printWindow = window.open('', '_blank');
  if(!printWindow){ alert("Please allow pop-ups to generate the PDF, then try again."); return; }
  const esc = (s) => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  printWindow.document.write(`
    <html>
    <head>
      <title>SOAP Note — ${esc(draft.client)}</title>
      <style>
        body{ font-family: Georgia, serif; padding: 40px; color:#2B2A24; }
        h1{ font-size: 20px; margin-bottom: 4px; }
        .meta{ color:#5B584C; margin-bottom: 24px; font-size: 13px; }
        h2{ font-size: 14px; text-transform: uppercase; letter-spacing: .05em; margin-top: 24px; margin-bottom: 6px; color:#727F63; }
        p{ font-size: 14px; line-height: 1.5; }
      </style>
    </head>
    <body>
      <h1>SOAP Note</h1>
      <div class="meta">${esc(draft.client) || '(no client name entered)'} — ${esc(draft.date)}</div>
      <h2>Subjective</h2><p>${esc(draft.s) || '—'}</p>
      <h2>Objective</h2><p>${esc(draft.o) || '—'}</p>
      <h2>Assessment</h2><p>${esc(draft.a) || '—'}</p>
      <h2>Plan</h2><p>${esc(draft.p) || '—'}</p>
    </body>
    </html>
  `);
  printWindow.document.close();
  printWindow.focus();
  setTimeout(()=>{ printWindow.print(); }, 300);

  clearSoapDraft();
  closeSoapNotes();
}

    html += `</div>`;

  if(item.steps){
    html += `<div class="block-label">Steps</div><ol class="steps">`;

        return `<li><span class="num">${idx+1}</span>

      if(subProtocolId){

        if(!sub){

function renderMyAccount(){
  const username = getCurrentUser();
  const user = findUser(username) || {};
  const errorHtml = myAccountError ? `<div class="auth-error">${myAccountError}</div>` : '';
  const successHtml = myAccountSuccess ? `<div class="storage-warning" style="border-color:var(--sage-deep);">${myAccountSuccess}</div>` : '';

  myAccountInner.innerHTML = `
    <button class="back-btn" id="my-account-back"><span class="chev">←</span> Home</button>
    <div class="agenda-step">
      <h2>My Account</h2>
      <p class="caption">${username}</p>
      ${errorHtml}
      ${successHtml}

      <div class="block-label">Change Password</div>
      <div class="field"><label>Current Password</label><input type="password" id="my-account-current-pw" autocomplete="current-password"></div>
      <div class="field"><label>New Password</label><input type="password" id="my-account-new-pw" autocomplete="new-password"></div>
      <button class="primary-btn" id="my-account-change-pw-btn">Change Password</button>

      <div class="block-label" style="margin-top:32px;">Security Question</div>
      <p class="caption">Used to reset your password yourself if you ever forget it. Re-enter your current password to update it.</p>
      <div class="field"><label>Question</label><input type="text" id="my-account-security-question" value="${user.securityQuestion || ''}" placeholder="e.g. What was your first pet's name?"></div>
      <div class="field"><label>Answer</label><input type="text" id="my-account-security-answer" placeholder="${user.securityQuestion ? 'Leave blank to keep your current answer' : ''}"></div>
      <div class="field"><label>Current Password (to confirm)</label><input type="password" id="my-account-security-current-pw" autocomplete="current-password"></div>
      <button class="primary-btn" id="my-account-save-question-btn">Save Security Question</button>
    </div>
  `;

  document.getElementById('my-account-back').addEventListener('click', closeMyAccount);

  document.getElementById('my-account-change-pw-btn').addEventListener('click', async ()=>{
    const currentPassword = document.getElementById('my-account-current-pw').value;
    const newPassword = document.getElementById('my-account-new-pw').value;
    if(!currentPassword || !newPassword){ myAccountError = 'Fill in both fields.'; myAccountSuccess=''; renderMyAccount(); return; }
    const result = await updateMyAccount({ currentPassword, newPassword });
    if(result.ok){
      logActivity(username, 'Changed their own password');
      myAccountError = '';
      myAccountSuccess = 'Password changed.';
    } else {
      myAccountSuccess = '';
      myAccountError = result.error || 'Could not change your password.';
    }
    renderMyAccount();
  });

  document.getElementById('my-account-save-question-btn').addEventListener('click', async ()=>{
    const currentPassword = document.getElementById('my-account-security-current-pw').value;
    const securityQuestion = document.getElementById('my-account-security-question').value.trim();
    const securityAnswer = document.getElementById('my-account-security-answer').value.trim();
    if(!currentPassword){ myAccountError = 'Enter your current password to confirm.'; myAccountSuccess=''; renderMyAccount(); return; }
    if(!securityQuestion){ myAccountError = 'Enter a security question.'; myAccountSuccess=''; renderMyAccount(); return; }
    const fields = { currentPassword, securityQuestion };
    if(securityAnswer) fields.securityAnswer = securityAnswer;
    else if(!user.securityQuestion){ myAccountError = 'Enter an answer.'; myAccountSuccess=''; renderMyAccount(); return; }
    const result = await updateMyAccount(fields);
    if(result.ok){
      logActivity(username, 'Updated their security question');
      myAccountError = '';
      myAccountSuccess = 'Security question saved.';
      await refreshUsersFromServer();
    } else {
      myAccountSuccess = '';
      myAccountError = result.error || 'Could not save your security question.';
    }
    renderMyAccount();
  });
}

async function updateMyAccount(fields){
  if(!isSyncConfigured()) return { ok:false, error:"Sync isn't set up on this device yet." };
  if(isDemoUser()) return { ok:true, error:null };
  try{
    const res = await fetch(`${SYNC_API_BASE}/auth/update-account`, {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(fields)
    });
    let body = null;
    try{ body = await res.json(); }catch(e){}
    return { ok: res.ok, error: (body && body.error) ? body.error : null };
  }catch(e){
    return { ok:false, error: "Couldn't reach the server." };
  }
}
