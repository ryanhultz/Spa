<style>
  :root{
    --stone:#ECE5D6;
    --stone-deep:#E1D7C2;
    --ink:#2B2A24;
    --ink-soft:#5B584C;
    --card:#F8F5EC;
    --sage:#727F63;
    --sage-deep:#565F49;
    --gold:#A9824F;
    --gold-soft:#D8C6A2;
    --line: rgba(43,42,36,0.14);
    --shadow: 0 10px 30px -14px rgba(43,42,36,0.35);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html{ accent-color: var(--sage); }
  *:focus{ outline:none; }
  *:focus-visible{
    outline:none;
    box-shadow:0 0 0 3px rgba(169,130,79,0.28);
    border-color:var(--gold) !important;
  }
  select{
    -webkit-appearance:none;
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%23A9824F'><path d='M5.5 7.5l4.5 4.5 4.5-4.5' stroke='%23A9824F' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:14px;
    padding-right:34px !important;
  }
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
  body{
    background:
      radial-gradient(120% 90% at 15% -10%, var(--stone-deep), var(--stone) 55%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    max-width:100%;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:560px;
    width:100%;
    margin:0 auto;
    padding:calc(28px + env(safe-area-inset-top)) 20px calc(60px + env(safe-area-inset-bottom));
    position:relative;
    overflow-x:hidden;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--sage-deep);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:"";
    width:16px;height:1px;background:var(--gold);
  }
  .home-header-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:22px;
  }
  h1.title{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(26px,7.5vw,36px);
    line-height:1.08;
    margin:0;
    letter-spacing:-0.01em;
  }
  h1.title em{
    font-style:italic;
    font-weight:500;
    color:var(--sage-deep);
  }
  .logout-btn{
    all:unset;
    box-sizing:border-box;
    cursor:pointer;
    flex:none;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#fff;
    border:1px solid var(--sage-deep);
    border-radius:999px;
    padding:7px 12px;
    margin-top:6px;
    background:var(--sage);
  }
  .logout-btn:active{ background:var(--sage-deep); }
  .sub{
    font-size:14.5px;
    color:var(--ink-soft);
    max-width:38ch;
    line-height:1.5;
    margin:0 0 30px;
  }
  .section-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:34px 0 12px;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .section-label span.count{
    color:var(--gold);
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }
  .letter-jump{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin:18px 0 8px;
  }
  .letter-chip{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--sage);
    border:1px solid var(--sage-deep);
    color:#fff;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:600;
    text-decoration:none;
  }
  .letter-chip:active{ background:var(--sage-deep); }
  .card-btn.allergy-result-btn.avoid{
    border-color:#D9B48F;
    background:#FBF2E8;
  }
  .card-btn.allergy-result-btn.avoid .name{ color:#8C4A2A; }
  .card-btn.allergy-result-btn.avoid .meta{ color:#8C4A2A; opacity:0.75; }
  .card-btn.allergy-result-btn.avoid .arrow{
    background:rgba(140,74,42,0.12);
    border:1px solid rgba(140,74,42,0.25);
    color:#8C4A2A;
  }
  .grid{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .grid + .grid{ margin-top:24px; }
  .card-btn{
    all:unset;
    box-sizing:border-box;
    cursor:pointer;
    background:var(--sage);
    border:1px solid var(--sage-deep);
    border-radius:var(--radius);
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card-btn:active{ transform:scale(0.985); background:var(--sage-deep); }
  .card-btn:hover{ border-color:var(--gold-soft); box-shadow:var(--shadow); }
  .card-btn .name{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:500;
    letter-spacing:-0.01em;
    color:#fff;
  }
  .card-btn .meta{
    font-size:12px;
    color:rgba(255,255,255,0.78);
    margin-top:3px;
  }
  .card-btn .arrow{
    width:30px;height:30px;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    border:1px solid rgba(255,255,255,0.3);
    display:flex;align-items:center;justify-content:center;
    flex:none;
    color:#fff;
    font-size:15px;
  }
  .ref-btn{
    background:var(--sage);
    border:1px solid var(--sage-deep);
  }
  .ref-btn .name{ font-size:16.5px; color:#fff; }

  /* Detail overlay */
  .auth-gate{
    position:fixed; inset:0;
    background:
      radial-gradient(120% 90% at 15% -10%, var(--stone-deep), var(--stone) 55%);
    z-index:100;
    overflow-y:auto;
    overflow-x:hidden;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    -webkit-overflow-scrolling:touch;
  }
  .auth-gate.hidden{ display:none; }
  .auth-inner{
    max-width:420px;
    width:100%;
    box-sizing:border-box;
    margin:0 auto;
    padding:calc(48px + env(safe-area-inset-top)) 24px calc(48px + env(safe-area-inset-bottom));
  }
  .auth-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--sage-deep);
    margin-bottom:6px;
  }
  .auth-inner h2{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(26px,8vw,32px);
    letter-spacing:-0.01em;
    margin:0 0 6px;
  }
  .auth-inner .caption{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.5;
    margin-bottom:28px;
  }
  .auth-error{
    background:#F4E3D3;
    border:1px solid #D9B48F;
    color:#8C4A2A;
    border-radius:12px;
    padding:12px 14px;
    font-size:12.5px;
    line-height:1.5;
    margin-bottom:18px;
  }
  .auth-link-row{
    text-align:center;
    margin-top:18px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .auth-link-row button{
    all:unset;
    box-sizing:border-box;
    cursor:pointer;
    color:var(--sage-deep);
    text-decoration:underline;
    text-decoration-style:dashed;
    font-weight:600;
  }
  .auth-admin-link{
    text-align:center;
    margin-top:40px;
  }
  .auth-admin-link button{
    all:unset;
    box-sizing:border-box;
    cursor:pointer;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    opacity:0.6;
  }

  .detail{
    position:fixed; inset:0;
    background:var(--stone);
    transform:translateY(100%);
    transition:transform .32s cubic-bezier(.22,.68,.2,1);
    overflow-y:auto;
    overflow-x:hidden;
    z-index:20;
    -webkit-overflow-scrolling:touch;
  }
  .detail.open{ transform:translateY(0); }
  .detail-inner{
    max-width:560px;
    width:100%;
    margin:0 auto;
    padding:calc(20px + env(safe-area-inset-top)) 20px calc(70px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  .back-btn{
    all:unset;
    box-sizing:border-box;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding:8px 4px;
    margin-bottom:14px;
  }
  .back-btn:active{ color:var(--sage-deep); }
  .back-btn .chev{
    width:26px;height:26px;border-radius:50%;
    background:var(--sage); border:1px solid var(--sage-deep);
    display:flex;align-items:center;justify-content:center;
    color:#fff;
  }
  .detail h2{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(28px,8vw,36px);
    letter-spacing:-0.01em;
    margin:4px 0 2px;
  }
  .detail .caption{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:24px;
    max-width:42ch;
    line-height:1.5;
  }
  .block-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 10px;
  }
  .tray{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:6px 16px;
    margin-bottom:28px;
  }
  .tray li{
    list-style:none;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    gap:10px;
    font-size:14.5px;
    line-height:1.4;
  }
  .tray li:last-child{ border-bottom:none; }
  .tray li::before{
    content:"";

<script>
/* ============ Error reporting (must be first — catches everything below) ============ */

const ERRORS_KEY = 'stopErrors_v1';
let errorsCache = [];
let stopErrorFallbackShown = false;

function loadErrorsLocalFallback(){
  try{ return JSON.parse(localStorage.getItem(ERRORS_KEY)) || []; }catch(e){ return []; }
}

function logError(message, location){
  const current = (function(){ try{ return localStorage.getItem('stopCurrentUser_v1') || 'Unknown'; }catch(e){ return 'Unknown'; } })();
  errorsCache.unshift({
    message: String(message == null ? 'Unknown error' : message).slice(0, 500),
    location: String(location || '').slice(0, 200),
    username: current,
    timestamp: new Date().toISOString()
  });
  while(errorsCache.length > 100) errorsCache.pop();
  try{ localStorage.setItem(ERRORS_KEY, JSON.stringify(errorsCache)); }catch(e){}
  try{
    if(typeof SYNC_API_BASE !== 'undefined'){
      fetch(`${SYNC_API_BASE}/data/stop-errors`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(errorsCache)
      }).catch(()=>{});
    }
  }catch(e){}
}

function showErrorFallback(message){
  if(stopErrorFallbackShown) return; // don't stack multiple overlays from a burst of errors
  stopErrorFallbackShown = true;
  const overlay = document.createElement('div');
  overlay.id = 'stop-error-fallback';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#ECE5D6;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,sans-serif;text-align:center;';
  overlay.innerHTML = `
    <div>
      <div style="font-size:40px;margin-bottom:12px;">⚠️</div>
      <div style="font-family:Georgia,serif;font-size:20px;margin-bottom:8px;color:#2B2A24;">Something went wrong</div>
      <div style="font-size:13px;color:#5B584C;margin-bottom:20px;max-width:280px;">The app hit an unexpected error. Reloading usually fixes it.</div>
      <button id="stop-error-reload-btn" style="background:#727F63;color:#fff;border:none;border-radius:14px;padding:14px 28px;font-size:13px;cursor:pointer;">Reload App</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('stop-error-reload-btn').addEventListener('click', function(){ location.reload(); });
}

window.addEventListener('error', function(event){
  logError(event.message, (event.filename || '') + ':' + (event.lineno || ''));
  showErrorFallback(event.message);
});
window.addEventListener('unhandledrejection', function(event){
  logError(String(event.reason && event.reason.message ? event.reason.message : event.reason), 'unhandled promise rejection');
  showErrorFallback('A background task failed unexpectedly.');
});

/* ============ Service worker (faster loads + Android install prompt) ============ */

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});

/* ============ Sync backend ============ */
// After deploying the Worker (see the included README), paste its URL below.
// Until then, the app falls back to local-only storage automatically.
const SYNC_API_BASE_RAW = 'https://stop-sync.ryanhultz.workers.dev';
const SYNC_API_BASE = SYNC_API_BASE_RAW.replace(/\/+$/, ''); // trailing slash tolerated either way

let syncStatus = 'unknown'; // 'ok' | 'offline' | 'not-configured'

function isSyncConfigured(){
  return SYNC_API_BASE && !SYNC_API_BASE.includes('REPLACE-WITH-YOUR-WORKER-URL');
}

async function syncGet(key){
  if(!isSyncConfigured()){ syncStatus = 'not-configured'; return null; }
  try{
    const res = await fetch(`${SYNC_API_BASE}/data/${key}`, { cache: 'no-store' });
    if(!res.ok) throw new Error('bad status');
    syncStatus = 'ok';
    return await res.json();
  }catch(e){
    syncStatus = 'offline';
    return null;
  }
}

async function syncPost(key, value){
  if(!isSyncConfigured()) return false;
  try{
    const token = (typeof getActiveAuthToken === 'function') ? getActiveAuthToken() : null;
    const headers = { 'Content-Type': 'application/json' };
    if(token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(`${SYNC_API_BASE}/data/${key}`, {
      method: 'POST',
      headers,
      body: JSON.stringify(value)
    });
    syncStatus = 'ok';
    return res.ok;
  }catch(e){
    syncStatus = 'offline';
    return false;
  }
}

// Same as syncPost, but returns the server's actual status/error instead
// of collapsing everything down to true/false — used anywhere we need to
// tell the person WHY a save failed, not just that it did.
async function syncPostChecked(key, value){
  if(!isSyncConfigured()) return { ok:false, status:0, error:"Sync isn't set up on this device yet." };
  try{
    const token = (typeof getActiveAuthToken === 'function') ? getActiveAuthToken() : null;
    const headers = { 'Content-Type': 'application/json' };
    if(token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(`${SYNC_API_BASE}/data/${key}`, {
      method: 'POST',
      headers,
      body: JSON.stringify(value)
    });
    syncStatus = 'ok';
    let body = null;
    try{ body = await res.json(); }catch(e){}
    return { ok: res.ok, status: res.status, error: (body && body.error) ? body.error : null };
  }catch(e){
    syncStatus = 'offline';
    return { ok:false, status:0, error:"Couldn't reach the server." };
  }
}

function syncStatusWarningHtml(){
  if(syncStatus === 'ok') return '';
  if(syncStatus === 'not-configured'){
    return `<div class="storage-warning">⚠️ Sync isn't set up yet — running in local-only mode (this device only). See the README for how to connect the shared database.</div>`;
  }
  if(syncStatus === 'offline'){
    return `<div class="storage-warning">⚠️ Can't reach the shared database right now — showing the last synced data for this device. Changes will still save locally.</div>`;
  }
  return '';
}

/* ---- Backup API ---- */

function authHeaders(extra){
  const token = (typeof getActiveAuthToken === 'function') ? getActiveAuthToken() : null;
  const headers = { ...(extra || {}) };
  if(token) headers['Authorization'] = `Bearer ${token}`;
  return headers;
}

// Creates a user, or patches just the given field(s) on an existing one —
// never touches any other user's record. Replaces the old pattern of
// reading the whole user list and writing it all back.
async function upsertUserOnServer(username, fields){
  if(!isSyncConfigured()) return { ok:false, status:0, error:"Sync isn't set up on this device yet." };
  try{
    const res = await fetch(`${SYNC_API_BASE}/users/upsert`, {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ username, ...fields })
    });
    let body = null;
    try{ body = await res.json(); }catch(e){}
    return { ok: res.ok, status: res.status, error: (body && body.error) ? body.error : null };
  }catch(e){
    return { ok:false, status:0, error:"Couldn't reach the server." };
  }
}

}

/* ---- Custom Protocols ---- */

const CUSTOM_PROTOCOLS_KEY = 'stopCustomProtocols_v1';
let customProtocolsCache = [];

function loadCustomProtocolsLocalFallback(){
  try{ return JSON.parse(localStorage.getItem(CUSTOM_PROTOCOLS_KEY)) || []; }catch(e){ return []; }
}

async function refreshCustomProtocolsFromServer(){
  const remote = await syncGet('stop-custom-protocols');
  if(Array.isArray(remote)){
    customProtocolsCache = remote;
    try{ localStorage.setItem(CUSTOM_PROTOCOLS_KEY, JSON.stringify(customProtocolsCache)); }catch(e){}
  } else {
    const seededFlag = await syncGet('stop-protocols-seeded');
    if(seededFlag === true){
      // Already seeded elsewhere before — just couldn't reach the server
      // right now. Use whatever this device last saw, don't reseed.
      customProtocolsCache = loadCustomProtocolsLocalFallback();
      if(!customProtocolsCache.length) customProtocolsCache = PROTOCOL_SEED || [];
    } else {
      // Never seeded anywhere — push the built-in protocols up as the
      // starting point, exactly once, across all devices.
      customProtocolsCache = (typeof PROTOCOL_SEED !== 'undefined') ? PROTOCOL_SEED : [];
      try{ localStorage.setItem(CUSTOM_PROTOCOLS_KEY, JSON.stringify(customProtocolsCache)); }catch(e){}
      syncPost('stop-custom-protocols', customProtocolsCache);
      syncPost('stop-protocols-seeded', true);
    }
  }
  if(typeof rebuildAllProtocols === 'function'){
    rebuildAllProtocols();
  }
}

function loadCustomProtocols(){ return customProtocolsCache; }
function saveCustomProtocols(list){
  customProtocolsCache = list;
  try{ localStorage.setItem(CUSTOM_PROTOCOLS_KEY, JSON.stringify(list)); }catch(e){}
  syncPost('stop-custom-protocols', list);
  if(typeof rebuildAllProtocols === 'function'){
    rebuildAllProtocols();
  }
}

function parseLines(text){
  return text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
}

function parsePrepLines(text){
  return parseLines(text).map(line => {
    const parts = line.split('|');
    const t = parts[0].trim();
    const note = parts[1] ? parts[1].trim() : undefined;
    return note ? { t, note } : { t };
  });
}

const LOGIN_DATE_KEY = 'stopCurrentUserLoginDate_v1';

function getCurrentUser(){
  try{ return localStorage.getItem(CURRENT_USER_KEY) || null; }catch(e){ return null; }
}
function setCurrentUser(username, token){
  try{
    localStorage.setItem(CURRENT_USER_KEY, username);
    localStorage.setItem(LOGIN_DATE_KEY, new Date().toDateString());
    if(token) localStorage.setItem(SESSION_TOKEN_KEY, token);
  }catch(e){}
}
function clearCurrentUser(){
  try{
    localStorage.removeItem(CURRENT_USER_KEY);
    localStorage.removeItem(LOGIN_DATE_KEY);
    localStorage.removeItem(SESSION_TOKEN_KEY);
  }catch(e){}
}
function getSessionToken(){
  try{ return localStorage.getItem(SESSION_TOKEN_KEY) || null; }catch(e){ return null; }
}
function getMasterToken(){
  try{ return localStorage.getItem(MASTER_TOKEN_KEY) || null; }catch(e){ return null; }
}
function setMasterToken(token){
  try{ localStorage.setItem(MASTER_TOKEN_KEY, token); }catch(e){}
}
function clearMasterToken(){
  try{ localStorage.removeItem(MASTER_TOKEN_KEY); }catch(e){}
}
// The token to use for the CURRENT admin session — master token if the
// user unlocked via the master password this session, otherwise their
// own logged-in session token.
function getActiveAuthToken(){
  if(typeof adminSessionMode !== 'undefined' && adminSessionMode === 'master'){
    return getMasterToken();
  }
  return getSessionToken();
}

const PERMISSION_KEYS = ['users','protocols','products','supplies','allergens','activity','backup','errors'];
function blankPermissions(){
  const p = {};
  PERMISSION_KEYS.forEach(k => p[k] = false);
  return p;
}
function getUserPermissions(user){
  const base = blankPermissions();
  if(user && user.permissions){
    PERMISSION_KEYS.forEach(k => { base[k] = !!user.permissions[k]; });
  }
  return base;
}
function loadActivityLog(){
  return activityCache;
}
function logActivity(username, action){
  activityCache.unshift({ username, action, timestamp: new Date().toISOString() });
  while(activityCache.length > 200) activityCache.pop();
  try{ localStorage.setItem(ACTIVITY_KEY, JSON.stringify(activityCache)); }catch(e){}
  syncPost('stop-activity', activityCache);
}

function checkAuthAndRender(){
  const gate = document.getElementById('auth-gate');
  const current = getCurrentUser();

  if(current && findUser(current)){
    let loginDate = null;
    try{ loginDate = localStorage.getItem(LOGIN_DATE_KEY); }catch(e){}
    if(loginDate && loginDate !== new Date().toDateString()){
      logActivity(current, 'Session expired (midnight reset)');
      clearCurrentUser();
      gate.classList.remove('hidden');
      renderAuthView();
      return;
    }
    gate.classList.add('hidden');
  } else {
    if(current && !findUser(current)) clearCurrentUser();
    gate.classList.remove('hidden');
    renderAuthView();
  }
}

      <div class="copyright-line">© 2026 Ryan Hultz</div>

      authError = ''; authView = 'login'; renderAuthView();
    });
  } else {
    inner.innerHTML = `
      <div class="auth-eyebrow">Spa Therapist Operations Portal</div>
      <h2>Log In</h2>
      <p class="caption">Enter your username and password to continue.</p>
      ${syncStatusWarningHtml()}
      ${errorHtml}

      <div class="field"><label>Password</label><input type="password" id="auth-password" autocomplete="current-password"></div>
      <button class="primary-btn" id="auth-login-btn">Log In</button>
      <div class="auth-link-row">New here? <button id="auth-show-create">Create an account</button></div>
      <div class="auth-admin-link"><button id="auth-show-admin">Management</button></div>

    document.getElementById('auth-login-btn').addEventListener('click', ()=>{

      attemptLogin(u, p);
    });

async function attemptLogin(username, password){
  if(!username || !password){ authError = 'Enter a username and password.'; renderAuthView(); return; }

  if(!isSyncConfigured()){
    authError = "Can't verify login — sync isn't set up yet on this device. See the README.";
    renderAuthView();
    return;
  }

  let result;
  try{
    const res = await fetch(`${SYNC_API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    result = await res.json();
  }catch(e){
    authError = "Couldn't reach the server. Check your connection and try again.";
    renderAuthView();
    return;
  }

  if(!result || !result.ok){
    authError = (result && result.error) || 'Incorrect username or password.';
    logActivity(username || '(blank)', 'Failed login attempt');
    renderAuthView();
    return;
  }

  setCurrentUser(result.username, result.token);
  logActivity(result.username, 'Logged in');
  authError = '';
  await refreshUsersFromServer();
  checkAuthAndRender();
}

async function attemptCreateAccount(username, password, confirmPw, code){
  if(!username || !password || !confirmPw){ authError = 'Fill in all fields.'; renderAuthView(); return; }
  if(password !== confirmPw){ authError = 'Passwords do not match.'; renderAuthView(); return; }

  if(!isSyncConfigured()){
    authError = "Can't create an account — sync isn't set up yet on this device. See the README.";
    renderAuthView();
    return;
  }

  let result;
  try{
    const res = await fetch(`${SYNC_API_BASE}/auth/signup`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, inviteCode: code })
    });
    result = await res.json();
  }catch(e){
    authError = "Couldn't reach the server. Check your connection and try again.";
    renderAuthView();
    return;
  }

  if(!result || !result.ok){
    authError = (result && result.error) || 'Could not create that account.';
    renderAuthView();
    return;
  }

  logActivity(username, 'Created account');
  setCurrentUser(result.username, result.token);
  logActivity(result.username, 'Logged in');
  authError = '';
  await refreshUsersFromServer();
  checkAuthAndRender();
}

function logout(){
  const current = getCurrentUser();
  if(current) logActivity(current, 'Logged out');
  clearCurrentUser();
  clearMasterToken();
  adminSessionMode = null;
  authView = 'login';
  authError = '';
  checkAuthAndRender();
}

  { key: 'products', name: 'Products', meta: 'Manage ingredients' },

  { key: 'activity', name: 'Activity Log', meta: 'Recent account activity' },

function getEffectiveAdminPermissions(){
  if(adminSessionMode === 'master') return { users:true, protocols:true, products:true, supplies:true, allergens:true, activity:true };
  const current = getCurrentUser();
  const user = current ? findUser(current) : null;
  return getUserPermissions(user);
}

function getAdminActingUsername(){
  const current = getCurrentUser();
  if(adminSessionMode === 'master'){
    return current ? `${current} (master access)` : 'Master Management';
  }
  return current || 'Unknown';
}

function openAdmin(){
  adminTab = null;
  const current = getCurrentUser();
  const user = current ? findUser(current) : null;
  const perms = getUserPermissions(user);
  const hasAnyPermission = PERMISSION_KEYS.some(k => perms[k]);

  if(hasAnyPermission){
    adminSessionMode = 'user';
    adminUnlocked = true;
  } else {
    adminSessionMode = null;
    adminUnlocked = false;
  }
  renderAdmin();
  document.getElementById('admin-overlay').classList.add('open');
}
function closeAdmin(){
  document.getElementById('admin-overlay').classList.remove('open');
  adminSessionMode = null;
}

function renderAdmin(){
  const inner = document.getElementById('admin-inner');

  if(!adminUnlocked){
    inner.innerHTML = `
      <button class="back-btn" id="admin-back"><span class="chev">←</span> Back</button>
      <div class="agenda-step">
        <h2>Management</h2>
        <p class="caption">Enter the management password to continue.</p>

        <div class="field"><label>Management Password</label><input type="password" id="admin-password-input"></div>
        <button class="primary-btn" id="admin-unlock-btn">Unlock</button>
      </div>
    `;
    document.getElementById('admin-back').addEventListener('click', closeAdmin);
    const tryUnlock = async ()=>{
      const val = document.getElementById('admin-password-input').value;
      const btn = document.getElementById('admin-unlock-btn');
      if(!isSyncConfigured()){
        document.getElementById('admin-pw-error').innerHTML = `<div class="auth-error">Can't verify — sync isn't set up yet on this device. See the README.</div>`;
        return;
      }
      btn.textContent = 'Checking…';
      let result;
      try{
        const res = await fetch(`${SYNC_API_BASE}/auth/master`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: val })
        });
        result = await res.json();
      }catch(e){
        document.getElementById('admin-pw-error').innerHTML = `<div class="auth-error">Couldn't reach the server. Check your connection.</div>`;
        btn.textContent = 'Unlock';
        return;
      }
      if(result && result.ok){
        setMasterToken(result.token);
        adminUnlocked = true;
        adminSessionMode = 'master';
        renderAdmin();
      } else {
        document.getElementById('admin-pw-error').innerHTML = `<div class="auth-error">${(result && result.error) || 'Incorrect password.'}</div>`;
        btn.textContent = 'Unlock';
      }
    };
    document.getElementById('admin-unlock-btn').addEventListener('click', tryUnlock);
    document.getElementById('admin-password-input').addEventListener('keydown', (e)=>{
      if(e.key === 'Enter') tryUnlock();
    });
    return;
  }

  const perms = getEffectiveAdminPermissions();
  const visibleSections = ADMIN_SECTIONS.filter(s => perms[s.key]);

  if(!adminTab){
    inner.innerHTML = `
      <button class="back-btn" id="admin-back"><span class="chev">←</span> Back</button>
      <div class="agenda-step">
        <h2>Management</h2>
        <p class="caption">Choose a section to manage.</p>
        ${syncStatusWarningHtml()}
        ${visibleSections.length ? `
          <div class="grid">
            ${visibleSections.map(s => `
              <button class="card-btn" data-admin-tab="${s.key}">
                <span>
                  <span class="name">${s.name}</span>
                  <span class="meta">${s.meta}</span>
                </span>
                ${iconArrow()}
              </button>
            `).join('')}
          </div>

      </div>
    `;
    document.getElementById('admin-back').addEventListener('click', closeAdmin);
    inner.querySelectorAll('[data-admin-tab]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        adminTab = btn.dataset.adminTab;
        renderAdmin();
      });
    });
    return;
  }

  if(!perms[adminTab]){
    adminTab = null;
    renderAdmin();
    return;
  }

  const sectionMeta = ADMIN_SECTIONS.find(s => s.key === adminTab);
  inner.innerHTML = `
    <button class="back-btn" id="admin-back"><span class="chev">←</span> Admin</button>
    <div class="agenda-step">
      <h2>${sectionMeta ? sectionMeta.name : 'Management'}</h2>

    </div>

  else if(adminTab === 'products') renderAdminProductsTab();
  else if(adminTab === 'supplies') renderAdminSuppliesTab();
  else if(adminTab === 'allergens') renderAdminAllergensTab();
  else if(adminTab === 'backup') renderAdminBackupTab();
  else if(adminTab === 'errors') renderAdminErrorsTab();
  else renderAdminActivityTab();
}

function renderAdminUsersTab(){

  content.innerHTML = `

            ${u.username}
            <span class="admin-supply-empty" style="display:block;font-size:11px;margin-top:2px;">${u.lastLogin ? `Last login: ${new Date(u.lastLogin).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}` : 'Never logged in'}</span>

            const active = getUserPermissions(u)[key];
            return `<button class="perm-chip ${active ? 'active' : ''}" data-username="${u.username}" data-perm="${key}">${label}</button>`;
          }).join('')}
        </div>
      `).join('') : `<p class="caption">No users yet.</p>`}
    </div>
  `;

  document.getElementById('admin-add-user-btn').addEventListener('click', async ()=>{
    const u = document.getElementById('admin-new-username').value.trim();
    const p = document.getElementById('admin-new-password').value;
    if(!u || !p){ alert('Enter a username and password.'); return; }
    await refreshUsersFromServer();
    if(findUser(u)){ alert('That username already exists.'); return; }
    const result = await upsertUserOnServer(u, { password: p, permissions: blankPermissions() });
    if(!result.ok){
      alert(`Couldn't add the user — the server rejected it (${result.error || 'error ' + result.status}).`);
    } else {
      logActivity(getAdminActingUsername(), `Added user "${u}"`);
    }
    await refreshUsersFromServer();
    renderAdminUsersTab();
  });
  content.querySelectorAll('.admin-reset-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const username = btn.dataset.username;
      const newPw = prompt(`New password for ${username}:`);
      if(!newPw) return;
      const result = await upsertUserOnServer(username, { password: newPw });
      if(!result.ok){
        alert(`Couldn't reset the password — the server rejected it (${result.error || 'error ' + result.status}).`);
      } else {
        logActivity(getAdminActingUsername(), `Reset password for "${username}"`);
        alert('Password reset.');
      }
      await refreshUsersFromServer();
      renderAdminUsersTab();
    });
  });
  content.querySelectorAll('.admin-remove-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const username = btn.dataset.username;
      if(!confirm(`Remove user "${username}"?`)) return;
      const result = await deleteUserOnServer(username);
      if(!result.ok){
        alert(`Couldn't remove the user — the server rejected it (${result.error || 'error ' + result.status}).`);
      } else {
        logActivity(getAdminActingUsername(), `Removed user "${username}"`);
        if(getCurrentUser() === username){ clearCurrentUser(); }
      }
      await refreshUsersFromServer();
      renderAdminUsersTab();
    });
  });
  content.querySelectorAll('.perm-chip').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const username = btn.dataset.username;
      const key = btn.dataset.perm;
      await refreshUsersFromServer();
      const user = findUser(username);
      if(!user) return;
      const updatedPermissions = getUserPermissions(user);
      const newVal = !updatedPermissions[key];
      updatedPermissions[key] = newVal;
      const result = await upsertUserOnServer(username, { permissions: updatedPermissions });
      if(!result.ok){
        alert(`Couldn't update permissions — the server rejected it (${result.error || 'error ' + result.status}).`);
      } else {
        const sectionName = ADMIN_SECTIONS.find(s => s.key === key).name;
        logActivity(getAdminActingUsername(), `${newVal ? 'Granted' : 'Revoked'} "${sectionName}" access for "${username}"`);
      }
      await refreshUsersFromServer();
      renderAdminUsersTab();
    });
  });
}

function prepRowHtml(row, idx, products){

      const existing = list.find(p => p.id === editingProtocolId);
      if(existing){
        existing.name = name;
        existing.caption = caption || '';
        existing.section = section;
        if(description) existing.menuDescription = description; else delete existing.menuDescription;
        if(callouts.length) existing.callouts = callouts; else delete existing.callouts;
        if(tableMakeup.length) existing.tableMakeup = tableMakeup; else delete existing.tableMakeup;
        if(prep.length) existing.prep = prep; else delete existing.prep;
        if(steps.length) existing.steps = steps; else delete existing.steps;
        saveCustomProtocols(list);
        logActivity(getAdminActingUsername(), `Edited protocol "${name}"`);
      }
      editingProtocolId = null;
    } else {
      const protocol = {
        id: makeId(),
        name,
        caption: caption || '',
        section,
        createdAt: new Date().toISOString()
      };
      if(description) protocol.menuDescription = description;
      if(callouts.length) protocol.callouts = callouts;
      if(tableMakeup.length) protocol.tableMakeup = tableMakeup;
      if(prep.length) protocol.prep = prep;
      if(steps.length) protocol.steps = steps;
      list.push(protocol);
      saveCustomProtocols(list);
      logActivity(getAdminActingUsername(), `Added protocol "${name}"`);
    }
    protocolFormTarget = null; // force a fresh, blank row-builder state next render
    renderAdminProtocolsTab();
  });

  const cancelBtn = document.getElementById('admin-cancel-edit-btn');
  if(cancelBtn){
    cancelBtn.addEventListener('click', ()=>{
      editingProtocolId = null;
      renderAdminProtocolsTab();
    });
  }

  content.querySelectorAll('.admin-product-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const panel = document.getElementById(`protocol-preview-${btn.dataset.id}`);
      if(panel) panel.classList.toggle('hidden');
    });
  });
  content.querySelectorAll('.admin-edit-protocol-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingProtocolId = btn.dataset.id;
      renderAdminProtocolsTab();
      content.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  content.querySelectorAll('.admin-remove-protocol-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const protocol = loadCustomProtocols().find(p => p.id === id);
      if(!confirm(`Remove protocol "${protocol ? protocol.name : ''}"?`)) return;
      const list = loadCustomProtocols().filter(p => p.id !== id);
      saveCustomProtocols(list);
      logActivity(getAdminActingUsername(), `Removed protocol "${protocol ? protocol.name : id}"`);
      if(editingProtocolId === id) editingProtocolId = null;
      renderAdminProtocolsTab();
    });
  });
}

async function loadBackupListIntoTab(){
  const listEl = document.getElementById('admin-backup-list');
  if(!listEl) return;
  const backups = await fetchBackupList();
  if(!document.getElementById('admin-backup-list')) return; // navigated away while loading

  if(backups === null){
    listEl.innerHTML = `<p class="caption">Couldn't load backups — check your connection.</p>`;
    return;
  }
  if(!backups.length){
    listEl.innerHTML = `<p class="caption">No backups yet. Tap "Back Up Now" to create one.</p>`;
    return;
  }

  listEl.innerHTML = backups.map(b => `
    <div class="admin-user-row">
      <div class="admin-user-name">
        ${b.timestamp ? new Date(b.timestamp).toLocaleString([], {month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit'}) : b.key}
        <span class="admin-supply-empty" style="display:block;font-size:11px;margin-top:2px;">${b.type === 'auto' ? 'Automatic' : 'Manual'}</span>
      </div>
      <div class="admin-user-actions">
        <button class="ghost-btn admin-restore-backup-btn" data-key="${b.key}">Restore</button>
        <button class="ghost-btn admin-delete-backup-btn" data-key="${b.key}">Delete</button>
      </div>
    </div>
  `).join('');

  listEl.querySelectorAll('.admin-restore-backup-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm("Restore this backup? This overwrites ALL current data — users, protocols, products, supplies, and allergens — with this backup's version. This cannot be undone.")) return;
      btn.textContent = 'Restoring…';
      const result = await restoreBackupByKey(btn.dataset.key);
      if(result && result.ok){
        logActivity(getAdminActingUsername(), `Restored backup from ${btn.dataset.key}`);
        await Promise.all([
          refreshUsersFromServer(), refreshActivityFromServer(), refreshProductsFromServer(),
          refreshSuppliesFromServer(), refreshCustomProtocolsFromServer(), refreshAllergensFromServer()
        ]);
        renderHomeScheduleList();
        checkAuthAndRender();
        alert('Backup restored — data has been refreshed.');
        renderAdminBackupTab();
      } else {
        alert((result && result.error) || 'Restore failed — check your connection.');
        btn.textContent = 'Restore';
      }
    });
  });
  listEl.querySelectorAll('.admin-delete-backup-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Delete this backup? This cannot be undone.')) return;
      const result = await deleteBackupByKey(btn.dataset.key);
      if(result && result.ok){
        logActivity(getAdminActingUsername(), `Deleted backup ${btn.dataset.key}`);
        loadBackupListIntoTab();
      } else {
        alert((result && result.error) || 'Delete failed — check your connection.');
      }
    });
  });
}

async function runImport2026_09(){
  const alreadyDone = await syncGet(IMPORT_2026_09_FLAG_KEY);
  if(alreadyDone === true) return;

  const existingProducts = loadProducts();
  const existingNames = new Set(existingProducts.map(p => `${(p.brand||'').toLowerCase()}|${p.name.toLowerCase()}`));
  let productsChanged = false;
  IMPORT_PRODUCTS_2026_09.forEach(p => {
    const key = `${p.brand.toLowerCase()}|${p.name.toLowerCase()}`;
    if(!existingNames.has(key)){
      existingProducts.push({ id: makeId(), brand: p.brand, name: p.name, ingredients: p.ingredients, createdAt: new Date().toISOString() });
      existingNames.add(key);
      productsChanged = true;
    }
  });
  if(productsChanged){
    saveProducts(existingProducts);
  }

  const existingProtocols = loadCustomProtocols();
  const existingProtocolNames = new Set(existingProtocols.map(p => p.name.toLowerCase()));
  let protocolsChanged = false;
  IMPORT_MASSAGES_2026_09.forEach(m => {
    const key = m.name.toLowerCase();
    if(!existingProtocolNames.has(key)){
      existingProtocols.push({ id: makeId(), createdAt: new Date().toISOString(), ...m });
      existingProtocolNames.add(key);
      protocolsChanged = true;
    }
  });
  if(protocolsChanged){
    saveCustomProtocols(existingProtocols);
  }

  await syncPost(IMPORT_2026_09_FLAG_KEY, true);
  logActivity('System', `Imported ${IMPORT_PRODUCTS_2026_09.length} products and ${IMPORT_MASSAGES_2026_09.length} massage protocols (2026-09 batch)`);
}

function formatSlotTime(minutes){
  const h24 = Math.floor(minutes/60), min = minutes%60;
  const ampm = h24 < 12 ? 'AM' : 'PM';
  let h12 = h24 % 12; if(h12 === 0) h12 = 12;
  return `${h12}:${min.toString().padStart(2,'0')} ${ampm}`;
}

function buildSlots(startMin, endMin){
  const slots = [];
  let t = startMin;
  while(t + 50 <= endMin){
    slots.push({time:t, client:'', client2:'', service:'', enhancement:'', room:'', duration:50, hidden:false});
    t += 60;
  }
  return slots;
}

/* ---------- Paste-to-schedule parsing ---------- */

function timeStringToMinutes(t){
  const m = t.match(/(\d{1,2}):(\d{2})\s*([ap]m)/i);
  if(!m) return null;
  let h = parseInt(m[1],10);
  const min = parseInt(m[2],10);
  const ap = m[3].toLowerCase();
  if(ap === 'pm' && h !== 12) h += 12;
  if(ap === 'am' && h === 12) h = 0;
  return h*60 + min;
}

function parsePastedSchedule(text){
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const timeRangeRe = /^(\d{1,2}:\d{2}\s*[ap]m)\s*-\s*(\d{1,2}:\d{2}\s*[ap]m)$/i;
  const standaloneTimeRe = /^(\d{1,2}:\d{2}\s*[ap]m)$/i;
  const serviceLineRe = /^(.+?)\s+(\d+)\s*min$/i;

  const appointments = [];
  const standaloneLabels = [];

  for(let i=0; i<lines.length; i++){
    const line = lines[i];
    const rangeMatch = line.match(timeRangeRe);
    if(rangeMatch){
      const startMin = timeStringToMinutes(rangeMatch[1]);
      const endMin = timeStringToMinutes(rangeMatch[2]);
      const nameLine = lines[i+1];
      const serviceLine = lines[i+2];
      if(nameLine && serviceLine && startMin !== null && endMin !== null){
        const svcMatch = serviceLine.match(serviceLineRe);
        if(svcMatch){
          let dur = endMin - startMin;
          if(dur <= 0) dur += 24*60;
          appointments.push({
            startMin,
            duration: dur >= 75 ? 100 : 50,
            client: nameLine,
            serviceText: svcMatch[1].trim()
          });
          i += 2;
          continue;
        }
      }
    }
    if(standaloneTimeRe.test(line)){
      standaloneLabels.push(timeStringToMinutes(line));
    }
  }
  return { appointments, standaloneLabels };
}

const MATCH_STOPWORDS = new Set(['to','be','the','of','a','an','and']);

function normalizeServiceWords(str){
  return str.toLowerCase()
    .replace(/[-–—]/g, ' ')
    .replace(/[^a-z0-9\s]/g, '')
    .split(/\s+/)
    .filter(w => w && !MATCH_STOPWORDS.has(w));
}

function matchServiceName(extractedText){
  const extractedWords = normalizeServiceWords(extractedText);
  if(!extractedWords.length) return '';
  let best = '', bestScore = 0;
  Object.values(SERVICE_OPTIONS).flat().forEach(candidate => {
    const candWords = normalizeServiceWords(candidate);
    const overlap = extractedWords.filter(w => candWords.includes(w)).length;
    const score = overlap / extractedWords.length;
    if(score > bestScore){ bestScore = score; best = candidate; }
  });
  return bestScore >= 0.5 ? best : '';
}

function buildAgendaFromPastedText(text){
  const { appointments, standaloneLabels } = parsePastedSchedule(text);
  if(!appointments.length){
    alert("Couldn't find any appointments in that text. Make sure you copied the full schedule block, including times, names, and services.");
    return false;
  }

  const apptStarts = appointments.map(a => a.startMin);
  const start = Math.min(...apptStarts);

  let end = Math.max(...appointments.map(a => a.startMin + a.duration));
  end = Math.max(end, Math.max(...apptStarts) + 60);

  if(standaloneLabels.length){
    const maxLabel = Math.max(...standaloneLabels);
    let diff = (maxLabel - start) % 60;
    if(diff < 0) diff += 60;
    const aligned = diff === 0 ? maxLabel : maxLabel + (60 - diff);
    end = Math.max(end, aligned + 60);
  }

  const slots = buildSlots(start, end);
  let unmatchedCount = 0;

  appointments.forEach(appt => {
    const idx = slots.findIndex(s => s.time === appt.startMin);
    if(idx === -1) return;
    const matched = matchServiceName(appt.serviceText);
    if(!matched) unmatchedCount++;
    slots[idx].client = appt.client;
    slots[idx].service = matched;
    slots[idx].duration = appt.duration;
    if(appt.duration === 100 && slots[idx+1]){
      slots[idx+1].hidden = true;
    }
  });

  agenda.slots = slots;
  agenda.step = 'fill';
  saveAgendaState();

  if(unmatchedCount > 0){
    alert(`Imported ${appointments.length} appointment${appointments.length===1?'':'s'}. ${unmatchedCount} service${unmatchedCount===1?'':'s'} couldn't be auto-matched — please check and select manually.`);
  }
  return true;
}

const AGENDA_STORAGE_KEY = 'spaAgendaState_v1';

function storageAvailable(){
  try{
    const testKey = '__storage_test__';
    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);
    return true;
  }catch(e){
    return false;
  }
}

const STORAGE_OK = storageAvailable();

function saveAgendaState(){
  try{
    localStorage.setItem(AGENDA_STORAGE_KEY, JSON.stringify({
      step: agenda.step,
      slots: agenda.slots
    }));
  }catch(e){ /* storage unavailable — continue without persistence */ }
  renderHomeScheduleList();
}

function restoreAgendaState(){
  try{
    const raw = localStorage.getItem(AGENDA_STORAGE_KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(parsed && Array.isArray(parsed.slots) && parsed.slots.length){
      agenda.slots = parsed.slots;
      agenda.step = (parsed.step === 'fill' || parsed.step === 'agenda') ? parsed.step : 'fill';
    }
  }catch(e){ /* corrupt or unavailable storage — start fresh */ }
}

function renderHomeScheduleList(){
  const container = document.getElementById('home-schedule');
  if(!container) return;
  const visible = agenda.slots.filter(s => !s.hidden);
  if(!visible.length){
    container.innerHTML = '';
    return;
  }
  const nowMin = currentMinutesNow();
  const current = visible.find(s => nowMin >= s.time && nowMin < s.time + s.duration);
  container.innerHTML = `
    <div class="section-label">Today's Schedule</div>
    <div class="agenda-list">
      ${visible.map(s => {
        const svcLine = [s.service, s.enhancement].filter(Boolean).join(' + ');
        const clientLine = [s.client, s.client2].filter(Boolean).join(' & ') || 'Open';
        const isCurrent = current && s.time === current.time;
        return `<div class="agenda-row ${isCurrent ? 'current' : ''}">
          <span class="ar-time">${formatSlotTime(s.time)}</span>
          <span class="ar-client">${clientLine}${s.room ? `<span class="ar-room">${s.room}</span>` : ''}</span>
          <span class="ar-service">${svcLine || '—'}</span>
        </div>`;
      }).join('')}
    </div>
  `;
}

/* ---------- Allergy Lookup ---------- */

function extractBotanicalKey(text){
  const idx = text.indexOf('(');
  if(idx === -1) return text.trim().toLowerCase();
  return text.slice(0, idx).trim().toLowerCase();
}

function extractCommonNameFromText(text){
  const m = text.match(/\(([^)]+)\)/);
  return m ? m[1].trim() : '';
}

function getMergedAllergenList(){
  const products = loadProducts();
  const manual = loadAllergens();

  // Step 1: group every raw ingredient variant by its botanical (Latin) key —
  // e.g. "Lavandula Angustifolia (Lavender) Oil" and "...Flower Extract"
  // and the plain "...(Lavender)" all share the botanical key
  // "lavandula angustifolia", so they group together automatically.
  const groups = new Map(); // botanicalKey -> { variants:Set<string>, commonName:string, manualId:string|null }

  products.forEach(p => (p.ingredients || []).forEach(ing => {
    const text = ing.trim();
    if(!text) return;
    const key = extractBotanicalKey(text);
    if(!groups.has(key)){
      groups.set(key, { variants: new Set(), commonName: extractCommonNameFromText(text), manualId: null });
    }
    groups.get(key).variants.add(text.toLowerCase());
  }));

  // Step 2: apply manual common-name assignments. An admin only needs to
  // alias ONE variant (or just the plain botanical name) and it now applies
  // to every variant sharing that botanical key.
  manual.forEach(a => {
    if(!a.fullName) return;
    const key = extractBotanicalKey(a.fullName.trim());
    if(groups.has(key)){
      const g = groups.get(key);
      g.commonName = a.commonName || g.commonName;
      g.manualId = a.id;
    } else {
      // Pure manual addition not tied to any product ingredient yet
      groups.set(key, { variants: new Set([a.fullName.trim().toLowerCase()]), commonName: a.commonName || '', manualId: a.id });
    }
  });

  // Step 3: fallback merge — if two different botanical keys ended up with
  // the same common name (e.g. a synonym Latin name for the same plant),
  // fold them into one entry.
  const byCommonName = new Map(); // lowercase common name -> merged group
  const noCommonName = [];

  groups.forEach((g, botanicalKey) => {
    const commonKey = (g.commonName || '').trim().toLowerCase();
    if(!commonKey){
      noCommonName.push({ botanicalKey, ...g });
      return;
    }
    if(byCommonName.has(commonKey)){
      const existing = byCommonName.get(commonKey);
      g.variants.forEach(v => existing.variants.add(v));
      if(g.manualId) existing.manualId = g.manualId;
    } else {
      byCommonName.set(commonKey, { botanicalKey, ...g });
    }
  });

  const finalGroups = [...byCommonName.values(), ...noCommonName];

  return finalGroups.map(g => {
    const variantList = Array.from(g.variants);
    // Prefer the shortest variant as the representative full name — usually
    // the plain "Latin (Common)" form without an extra Oil/Extract suffix.
    const representative = variantList.sort((a, b) => a.length - b.length)[0] || g.botanicalKey;
    return {
      id: g.manualId,
      commonName: g.commonName || '',
      fullName: representative,
      matchKeys: variantList
    };
  });
}

function allergenDisplayName(entry){
  if(entry.commonName && entry.fullName && entry.commonName.toLowerCase() !== entry.fullName.toLowerCase()){
    return `${entry.commonName} (${entry.fullName})`;
  }
  return entry.commonName || entry.fullName;
}

function allergenSortKey(entry){
  return (entry.commonName || entry.fullName || '').toLowerCase();
}

function getProtocolSafety(entry){
  const products = loadProducts();
  const searchTerms = new Set((entry.matchKeys || [entry.fullName]).map(s => s.trim().toLowerCase()));

  const matchingProductNames = products
    .filter(p => (p.ingredients || []).some(ing => searchTerms.has(ing.trim().toLowerCase())))
    .map(p => p.name.toLowerCase());

  const safe = [];
  const unsafe = [];
  ALL.forEach(protocol => {
    const prepTexts = (protocol.prep || []).map(item => item.t.toLowerCase());
    const isUnsafe = matchingProductNames.some(name => prepTexts.some(t => t.includes(name)));
    if(isUnsafe) unsafe.push(protocol); else safe.push(protocol);
  });
  return { safe, unsafe };
}

const allergyOverlay = document.getElementById('allergy-overlay');
const allergyInner = document.getElementById('allergy-inner');
let allergyStep = 'list'; // 'list' | 'detail'
let allergySelectedKey = null;
let allergySearchTerm = '';

function openAllergyLookup(){
  allergyStep = 'list';
  allergySelectedKey = null;
  allergySearchTerm = '';
  renderAllergyLookup();
  allergyOverlay.classList.add('open');
  allergyOverlay.scrollTop = 0;
}
function closeAllergyLookup(){
  allergyOverlay.classList.remove('open');
}

function renderAllergyLookup(){
  if(allergyStep === 'detail' && allergySelectedKey){
    renderAllergyDetail();
  } else {
    renderAllergyList();
  }
}

function renderAllergyList(){
  const all = getMergedAllergenList();
  const filtered = allergySearchTerm
    ? all.filter(e => allergenDisplayName(e).toLowerCase().includes(allergySearchTerm.toLowerCase()))
    : all;

  filtered.sort((a, b) => allergenSortKey(a).localeCompare(allergenSortKey(b)));

  const groups = {};
  filtered.forEach(entry => {
    const letter = (allergenSortKey(entry)[0] || '#').toUpperCase();
    if(!groups[letter]) groups[letter] = [];
    groups[letter].push(entry);
  });
  const letters = Object.keys(groups).sort();

  allergyInner.innerHTML = `
    <button class="back-btn" id="allergy-back"><span class="chev">←</span> Home</button>
    <div class="agenda-step">
      <h2>Allergy Lookup</h2>
      <p class="caption">Find an ingredient to see which treatments are safe to recommend.</p>
      <div class="field"><input type="text" id="allergy-search" placeholder="Search ingredients…" value="${allergySearchTerm}"></div>
      ${letters.length ? `
        <div class="letter-jump">
          ${letters.map(l => `<a href="#allergy-letter-${l}" class="letter-chip">${l}</a>`).join('')}
        </div>
      ` : ''}
      ${letters.length ? letters.map(letter => `
        <div class="section-label" id="allergy-letter-${letter}">${letter}</div>
        <div class="grid">
          ${groups[letter].map(entry => `
            <button class="card-btn allergen-btn" data-key="${allergenSortKey(entry)}">
              <span><span class="name">${allergenDisplayName(entry)}</span></span>
              ${iconArrow()}
            </button>
          `).join('')}
        </div>
      `).join('') : `<p class="caption">No ingredients yet — add products with ingredients, or add allergens manually in Management → Allergies.</p>`}
    </div>
  `;

  document.getElementById('allergy-back').addEventListener('click', closeAllergyLookup);
  const searchInput = document.getElementById('allergy-search');
  searchInput.addEventListener('input', ()=>{
    allergySearchTerm = searchInput.value;
    renderAllergyList();
    document.getElementById('allergy-search').focus();
    const val = document.getElementById('allergy-search').value;
    document.getElementById('allergy-search').setSelectionRange(val.length, val.length);
  });
  allergyInner.querySelectorAll('.allergen-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      allergySelectedKey = btn.dataset.key;
      allergyStep = 'detail';
      renderAllergyLookup();
    });
  });
}

function renderAllergyDetail(){
  const all = getMergedAllergenList();
  const entry = all.find(e => allergenSortKey(e) === allergySelectedKey);
  if(!entry){
    allergyStep = 'list';
    renderAllergyList();
    return;
  }
  const { safe, unsafe } = getProtocolSafety(entry);

  allergyInner.innerHTML = `
    <button class="back-btn" id="allergy-back"><span class="chev">←</span> Allergy Lookup</button>
    <div class="agenda-step">
      <h2>${allergenDisplayName(entry)}</h2>
      <p class="caption">Based on ingredients in your Products list and each treatment's Prep list.</p>

      <div class="block-label">⚠️ Contains This Ingredient — Avoid</div>
      ${unsafe.length ? `
        <div class="grid">
          ${unsafe.map(p => `
            <button class="card-btn allergy-result-btn avoid" data-id="${p.id}">
              <span><span class="name">${p.name}</span><span class="meta">${p.caption || ''}</span></span>
              ${iconArrow()}
            </button>
          `).join('')}
        </div>
      ` : `<p class="caption">No protocols contain this ingredient.</p>`}

      <div class="block-label" style="margin-top:28px;">✅ Recommended Treatments</div>
      ${safe.length ? `
        <div class="grid">
          ${safe.map(p => `
            <button class="card-btn allergy-result-btn" data-id="${p.id}">
              <span><span class="name">${p.name}</span><span class="meta">${p.caption || ''}</span></span>
              ${iconArrow()}
            </button>
          `).join('')}
        </div>
      ` : `<p class="caption">No protocols found without this ingredient.</p>`}
    </div>
  `;

  document.getElementById('allergy-back').addEventListener('click', ()=>{
    allergyStep = 'list';
    renderAllergyLookup();
  });
  allergyInner.querySelectorAll('.allergy-result-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      closeAllergyLookup();
      openProtocols();
      openDetail(btn.dataset.id);
    });
  });
}

  document.getElementById('back-btn').addEventListener('click', closeDetail);
  const descToggle = document.getElementById('desc-toggle');
  if(descToggle){
    descToggle.addEventListener('click', ()=>{
      document.getElementById('desc-panel').classList.toggle('hidden');
      descToggle.classList.toggle('open');
      descToggle.lastChild.textContent = descToggle.classList.contains('open') ? ' Hide description' : ' See description';
    });
  }
  detailInner.querySelectorAll('.routine-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const panel = document.getElementById(btn.dataset.target);
      if(panel) panel.classList.toggle('hidden');
    });
  });
  detail.scrollTop = 0;
}

function closeDetail(){
  detail.classList.remove('open');
}

document.getElementById('protocols-inner').addEventListener('click', (e)=>{
  const btn = e.target.closest('.card-btn');
  if(btn) openDetail(btn.dataset.id);
});

/* ---------- Agenda ---------- */

const agendaOverlay = document.getElementById('agenda-overlay');
const agendaInner = document.getElementById('agenda-inner');

function openAgenda(){
  if(!agenda.slots.length){
    agenda.step = 'setup';
  }
  renderAgenda();
  agendaOverlay.classList.add('open');
  agendaOverlay.scrollTop = 0;
}

function closeAgenda(){
  agendaOverlay.classList.remove('open');
  if(agenda.timer){ clearInterval(agenda.timer); agenda.timer = null; }
}

document.getElementById('open-agenda').addEventListener('click', openAgenda);
document.getElementById('logout-btn').addEventListener('click', logout);
document.getElementById('home-admin-link').addEventListener('click', openAdmin);

/* ---------- Breakroom app launch ---------- */

document.getElementById('open-breakroom').addEventListener('click', ()=>{
  const fallbackUrl = 'https://www.breakroomapp.com/';
  const clickTime = Date.now();

  window.location.href = 'breakroom://';

  setTimeout(()=>{
    // If we're still here (and not backgrounded) after the attempt,
    // the app likely isn't installed or the scheme didn't launch it.
    if(!document.hidden && (Date.now() - clickTime) < 2000){
      window.open(fallbackUrl, '_blank', 'noopener');
    }
  }, 1200);
});

/* ---------- Treatment Protocols overlay ---------- */

const protocolsOverlay = document.getElementById('protocols-overlay');

function openProtocols(){
  protocolsOverlay.classList.add('open');
  protocolsOverlay.scrollTop = 0;
}

function closeProtocols(){
  protocolsOverlay.classList.remove('open');
}

document.getElementById('open-protocols').addEventListener('click', openProtocols);
document.getElementById('protocols-back').addEventListener('click', closeProtocols);

function renderAgenda(){
  if(agenda.timer){ clearInterval(agenda.timer); agenda.timer = null; }

  if(agenda.step === 'setup') renderAgendaSetup();
  else if(agenda.step === 'fill') renderAgendaFill();
  else if(agenda.step === 'agenda') renderAgendaView();
}

function storageWarningHtml(){
  if(STORAGE_OK) return '';
  return `<div class="storage-warning">⚠️ This browser can't save schedule data here — entries will be lost on reload. This is usually fixed by opening the site's deployed URL directly in your browser, rather than a preview or private/incognito window.</div>`;
}

function renderAgendaSetup(){
  const timeOpts = TIME_OPTIONS.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
  agendaInner.innerHTML = `
    <button class="back-btn" id="agenda-back"><span class="chev">←</span> Home</button>
    <div class="agenda-step">
      <h2>Agenda</h2>
      <p class="caption">Paste today's schedule to build it automatically, or set a shift below to build it blank.</p>
      ${storageWarningHtml()}
      <div class="field">
        <label>Paste Schedule</label>
        <textarea id="agenda-paste" rows="7" placeholder="Paste the schedule text here…"></textarea>
      </div>
      <button class="primary-btn" id="agenda-extract">Extract &amp; Build</button>
      <div class="setup-divider">or set manually</div>
      <div class="field">
        <label>Start Time</label>
        <select id="agenda-start">${timeOpts}</select>
      </div>
      <div class="field">
        <label>End Time</label>
        <select id="agenda-end">${timeOpts}</select>
      </div>
      <button class="primary-btn" id="agenda-build">Build Schedule</button>
    </div>
  `;
  document.getElementById('agenda-back').addEventListener('click', closeAgenda);
  document.getElementById('agenda-start').value = 510; // 8:30 AM default
  document.getElementById('agenda-end').value = 990;   // 4:30 PM default
  document.getElementById('agenda-extract').addEventListener('click', ()=>{
    const text = document.getElementById('agenda-paste').value;
    if(!text.trim()){
      alert('Paste your schedule text into the box first.');
      return;
    }
    const ok = buildAgendaFromPastedText(text);
    if(ok) renderAgenda();
  });
  document.getElementById('agenda-build').addEventListener('click', ()=>{
    const startMin = parseInt(document.getElementById('agenda-start').value, 10);
    const endMin = parseInt(document.getElementById('agenda-end').value, 10);
    if(endMin <= startMin){
      alert('End time must be after start time.');
      return;
    }
    agenda.slots = buildSlots(startMin, endMin);
    agenda.step = 'fill';
    saveAgendaState();
    renderAgenda();
  });
}

function serviceOptionsHtml(selected){
  let html = `<option value="">Select service…</option>`;
  Object.keys(SERVICE_OPTIONS).forEach(group=>{
    html += `<optgroup label="${group}">`;
    html += SERVICE_OPTIONS[group].map(s => `<option value="${s}" ${s===selected?'selected':''}>${s}</option>`).join('');
    html += `</optgroup>`;
  });
  return html;
}

function enhancementOptionsHtml(selected){
  let html = `<option value="">Add enhancement (optional)…</option>`;
  Object.keys(ENHANCEMENT_OPTIONS).forEach(group=>{
    html += `<optgroup label="${group}">`;
    html += ENHANCEMENT_OPTIONS[group].map(s => `<option value="${s}" ${s===selected?'selected':''}>${s}</option>`).join('');
    html += `</optgroup>`;
  });
  return html;
}

function isCouplesService(serviceName){
  return SERVICE_OPTIONS["Couples"].includes(serviceName);
}

function roomOptionsHtml(selected){
  let html = `<option value="">Assign room…</option>`;
  html += ROOM_OPTIONS.map(r => `<option value="${r}" ${r===selected?'selected':''}>${r}</option>`).join('');
  return html;
}

function renderAgendaFill(){
  const rows = agenda.slots.map((slot, idx) => {
    if(slot.hidden) return '';
    return `
    <div class="slot-row">
      <div class="slot-time-row">
        <div class="slot-time">${formatSlotTime(slot.time)}</div>
        <div class="slot-time-controls">
          <div class="duration-toggle ${slot.duration===100?'on-100':''}" data-idx="${idx}">
            <div class="dur-thumb"></div>
            <span class="dur-opt ${slot.duration===50?'active':''}">50 min</span>
            <span class="dur-opt ${slot.duration===100?'active':''}">100 min</span>
          </div>
          <button class="remove-slot-btn" data-idx="${idx}" title="Remove this appointment time" aria-label="Remove this appointment time">✕</button>
        </div>
      </div>
      <input type="text" placeholder="Client name" data-idx="${idx}" class="agenda-client-input" value="${slot.client}">
      ${isCouplesService(slot.service) ? `<input type="text" placeholder="Client 2 name" data-idx="${idx}" class="agenda-client2-input" value="${slot.client2}">` : ''}
      <select data-idx="${idx}" class="agenda-room-select">${roomOptionsHtml(slot.room)}</select>
      <select data-idx="${idx}" class="agenda-service-select">${serviceOptionsHtml(slot.service)}</select>
      <select data-idx="${idx}" class="agenda-enhancement-select">${enhancementOptionsHtml(slot.enhancement)}</select>
    </div>
  `;
  }).join('');

  const usedTimes = new Set(agenda.slots.map(s => s.time));
  const availableTimeOpts = TIME_OPTIONS.filter(o => !usedTimes.has(o.value));
  const addTimeOptsHtml = availableTimeOpts.length
    ? availableTimeOpts.map(o => `<option value="${o.value}">${o.label}</option>`).join('')
    : `<option value="">No more times available</option>`;

  agendaInner.innerHTML = `
    <button class="back-btn" id="agenda-back"><span class="chev">←</span> Agenda Setup</button>
    <div class="agenda-step">
      <h2>Today's Schedule</h2>
      <p class="caption">Enter the client name and service for each appointment. Switch to 100 min for a longer appointment — it will absorb the next open slot.</p>
      ${storageWarningHtml()}
      ${rows}
      <div class="add-time-row">
        <select id="agenda-add-time-select">${addTimeOptsHtml}</select>
        <button class="ghost-btn add-time-btn" id="agenda-add-time-btn" ${availableTimeOpts.length ? '' : 'disabled'}>+ Add Appointment Time</button>
      </div>
      <button class="primary-btn" id="agenda-finish">Finish</button>
    </div>
  `;
  document.getElementById('agenda-back').addEventListener('click', ()=>{
    agenda.step = 'setup';
    renderAgenda();
  });
  agendaInner.querySelectorAll('.agenda-client-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      agenda.slots[parseInt(inp.dataset.idx,10)].client = inp.value;
      saveAgendaState();
    });
  });
  agendaInner.querySelectorAll('.agenda-client2-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      agenda.slots[parseInt(inp.dataset.idx,10)].client2 = inp.value;
      saveAgendaState();
    });
  });
  agendaInner.querySelectorAll('.agenda-room-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      agenda.slots[parseInt(sel.dataset.idx,10)].room = sel.value;
      saveAgendaState();
    });
  });
  agendaInner.querySelectorAll('.agenda-service-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const idx = parseInt(sel.dataset.idx,10);
      agenda.slots[idx].service = sel.value;
      if(!isCouplesService(sel.value)){
        agenda.slots[idx].client2 = '';
      }
      saveAgendaState();
      renderAgendaFill();
    });
  });
  agendaInner.querySelectorAll('.agenda-enhancement-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      agenda.slots[parseInt(sel.dataset.idx,10)].enhancement = sel.value;
      saveAgendaState();
    });
  });
  agendaInner.querySelectorAll('.duration-toggle').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.dataset.idx,10);
      const newDur = agenda.slots[idx].duration === 100 ? 50 : 100;
      setSlotDuration(idx, newDur);
      saveAgendaState();
      renderAgendaFill();
    });
  });
  agendaInner.querySelectorAll('.remove-slot-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.idx,10);
      removeSlot(idx);
      saveAgendaState();
      renderAgendaFill();
    });
  });
  document.getElementById('agenda-add-time-btn').addEventListener('click', ()=>{
    const select = document.getElementById('agenda-add-time-select');
    const val = select.value;
    if(!val) return;
    addSlotAtTime(parseInt(val,10));
    saveAgendaState();
    renderAgendaFill();
  });
  document.getElementById('agenda-finish').addEventListener('click', ()=>{
    agenda.step = 'agenda';
    saveAgendaState();
    renderAgenda();
  });
}

function removeSlot(idx){
  const removed = agenda.slots[idx];
  const hasData = removed.client || removed.client2 || removed.service;
  if(hasData && !confirm(`Remove the ${formatSlotTime(removed.time)} appointment? This will clear its entered info.`)){
    return;
  }
  agenda.slots.splice(idx, 1);
  // If the removed slot was a 100-min appointment, un-hide the slot it had absorbed
  if(removed.duration === 100 && agenda.slots[idx] && agenda.slots[idx].hidden){
    agenda.slots[idx].hidden = false;
    agenda.slots[idx].client = '';
    agenda.slots[idx].client2 = '';
    agenda.slots[idx].service = '';
    agenda.slots[idx].enhancement = '';
    agenda.slots[idx].room = '';
    agenda.slots[idx].duration = 50;
  }
}

function addSlotAtTime(timeMin){
  const newSlot = {time:timeMin, client:'', client2:'', service:'', enhancement:'', room:'', duration:50, hidden:false};
  let insertAt = agenda.slots.findIndex(s => s.time > timeMin);
  if(insertAt === -1) insertAt = agenda.slots.length;
  agenda.slots.splice(insertAt, 0, newSlot);
}

function setSlotDuration(idx, dur){
  const slot = agenda.slots[idx];
  const next = agenda.slots[idx+1];
  slot.duration = dur;
  if(dur === 100){
    if(next){ next.hidden = true; }
  } else {
    if(next){
      next.hidden = false;
      next.client = '';
      next.client2 = '';
      next.service = '';
      next.enhancement = '';
      next.room = '';
      next.duration = 50;
    }
  }
}

function currentMinutesNow(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}

function renderAgendaView(){
  agendaInner.innerHTML = `
    <button class="back-btn" id="agenda-back"><span class="chev">←</span> Home</button>
    <div class="agenda-step">
      <h2>Today's Agenda</h2>
      <p class="caption">Live view of your schedule.</p>
      ${storageWarningHtml()}
      <div class="now-next" id="agenda-now-next"></div>
      <div class="agenda-list" id="agenda-list"></div>
      <button class="ghost-btn" id="agenda-edit">Edit Schedule</button>
      <button class="ghost-btn" id="agenda-clear">Start New Day</button>
    </div>
  `;
  document.getElementById('agenda-back').addEventListener('click', closeAgenda);
  document.getElementById('agenda-edit').addEventListener('click', ()=>{
    agenda.step = 'fill';
    saveAgendaState();
    renderAgenda();
  });
  document.getElementById('agenda-clear').addEventListener('click', ()=>{
    if(!confirm('Clear today\'s schedule and start over?')) return;
    agenda.slots = [];
    agenda.step = 'setup';
    try{ localStorage.removeItem(AGENDA_STORAGE_KEY); }catch(e){}
    renderHomeScheduleList();
    renderAgenda();
  });

  updateAgendaLive();
  agenda.timer = setInterval(updateAgendaLive, 30000);
}

function updateAgendaLive(){
  const nowNextEl = document.getElementById('agenda-now-next');
  const listEl = document.getElementById('agenda-list');
  if(!nowNextEl || !listEl) return;

  const nowMin = currentMinutesNow();
  const visible = agenda.slots.filter(s => !s.hidden);
  const current = visible.find(s => nowMin >= s.time && nowMin < s.time + s.duration);
  const next = visible.find(s => s.time > (current ? current.time : nowMin - 1));

  function nnCardHtml(label, slot, cls){
    if(!slot){
      return `<div class="nn-card ${cls}"><div class="nn-label">${label}</div><div class="nn-empty">No appointment</div></div>`;
    }
    const svcLine = [slot.service, slot.enhancement].filter(Boolean).join(' + ');
    const clientLine = [slot.client, slot.client2].filter(Boolean).join(' & ') || 'Open';
    return `<div class="nn-card ${cls}">
      <div class="nn-label">${label}</div>
      <div class="nn-client">${clientLine}</div>
      <div class="nn-service">${svcLine || '—'}</div>
      <div class="nn-time">${formatSlotTime(slot.time)}${slot.room ? ' · ' + slot.room : ''}</div>
    </div>`;
  }

  nowNextEl.innerHTML = nnCardHtml('Now', current, 'now') + nnCardHtml('Next', next, 'next');

  listEl.innerHTML = visible.map(s => {
    const svcLine = [s.service, s.enhancement].filter(Boolean).join(' + ');
    const clientLine = [s.client, s.client2].filter(Boolean).join(' & ') || 'Open';
    return `
    <div class="agenda-row ${current && s.time===current.time ? 'current' : ''}">
      <span class="ar-time">${formatSlotTime(s.time)}</span>
      <span class="ar-client">${clientLine}${s.room ? `<span class="ar-room">${s.room}</span>` : ''}</span>
      <span class="ar-service">${svcLine || '—'}</span>
    </div>
  `;
  }).join('');
}
</script>
