<style>
  :root{
    --stone:#ECE5D6;
    --stone-deep:#E1D7C2;
    --ink:#2B2A24;
    --ink-soft:#5B584C;
    --card:#F8F5EC;
    --sage:#727F63;
    --sage-deep:#565F49;
    --gold:#A9824F;
    --gold-soft:#D8C6A2;
    --line: rgba(43,42,36,0.14);
    --shadow: 0 10px 30px -14px rgba(43,42,36,0.35);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
  body{
    background:
      radial-gradient(120% 90% at 15% -10%, var(--stone-deep), var(--stone) 55%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    max-width:100%;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:560px;
    width:100%;
    margin:0 auto;
    padding:28px 20px 60px;
    position:relative;
    overflow-x:hidden;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--sage-deep);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:"";
    width:16px;height:1px;background:var(--gold);
  }
  h1.title{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(26px,7.5vw,36px);
    line-height:1.08;
    margin:0 0 22px;
    letter-spacing:-0.01em;
  }
  h1.title em{
    font-style:italic;
    font-weight:500;
    color:var(--sage-deep);
  }
  .sub{
    font-size:14.5px;
    color:var(--ink-soft);
    max-width:38ch;
    line-height:1.5;
    margin:0 0 30px;
  }
  .section-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:34px 0 12px;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .section-label span.count{
    color:var(--gold);
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }
  .grid{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .grid + .grid{ margin-top:24px; }
  .card-btn{
    all:unset;
    cursor:pointer;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    box-shadow:0 1px 0 rgba(255,255,255,0.6) inset;
  }
  .card-btn:active{ transform:scale(0.985); }
  .card-btn:hover{ border-color:var(--gold-soft); box-shadow:var(--shadow); }
  .card-btn .name{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:500;
    letter-spacing:-0.01em;
  }
  .card-btn .meta{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .card-btn .arrow{
    width:30px;height:30px;
    border-radius:50%;
    background:var(--stone);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    flex:none;
    color:var(--sage-deep);
    font-size:15px;
  }
  .ref-btn{
    background:transparent;
    border:1px dashed var(--line);
  }
  .ref-btn .name{ font-size:16.5px; color:var(--sage-deep); }

  /* Detail overlay */
  .detail{
    position:fixed; inset:0;
    background:var(--stone);
    transform:translateY(100%);
    transition:transform .32s cubic-bezier(.22,.68,.2,1);
    overflow-y:auto;
    overflow-x:hidden;
    z-index:20;
    -webkit-overflow-scrolling:touch;
  }
  .detail.open{ transform:translateY(0); }
  .detail-inner{
    max-width:560px;
    width:100%;
    margin:0 auto;
    padding:20px 20px 70px;
    overflow-x:hidden;
  }
  .back-btn{
    all:unset;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding:8px 4px;
    margin-bottom:14px;
  }
  .back-btn:active{ color:var(--sage-deep); }
  .back-btn .chev{
    width:26px;height:26px;border-radius:50%;
    background:var(--card); border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
  }
  .detail h2{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(28px,8vw,36px);
    letter-spacing:-0.01em;
    margin:4px 0 2px;
  }
  .detail .caption{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:24px;
    max-width:42ch;
    line-height:1.5;
  }
  .block-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 10px;
  }
  .tray{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:6px 16px;
    margin-bottom:28px;
  }
  .tray li{
    list-style:none;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    gap:10px;
    font-size:14.5px;
    line-height:1.4;
  }
  .tray li:last-child{ border-bottom:none; }
  .tray li::before{
    content:"";
    width:6px;height:6px;
    border-radius:50%;
    background:var(--gold);
    flex:none;
    transform:translateY(-2px);
  }
  .tray li .note{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    font-style:italic;
    margin-top:2px;
  }
  ol.steps{
    list-style:none;
    margin:0 0 28px;
    padding:0 0 0 2px;
    position:relative;
  }
  ol.steps::before{
    content:"";
    position:absolute;
    left:15px; top:6px; bottom:6px;
    width:1px;
    background:var(--line);
  }
  ol.steps li{
    position:relative;
    padding:0 0 22px 42px;
    font-size:15px;
    line-height:1.5;
  }
  ol.steps li:last-child{ padding-bottom:0; }
  ol.steps li .num{
    position:absolute;
    left:0; top:0;
    width:31px;height:31px;
    border-radius:50%;
    background:var(--sage);
    color:#fff;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    display:flex;align-items:center;justify-content:center;
  }
  .flag{
    color:var(--ink-soft);
    font-style:italic;
  }
  .callout{
    background:var(--stone-deep);
    border-left:3px solid var(--gold);
    border-radius:4px 10px 10px 4px;
    padding:12px 14px;
    font-size:13px;
    line-height:1.55;
    color:var(--ink);
    margin-bottom:10px;
  }
  .callout b{ color:var(--sage-deep); }
  .scan-note{
    font-size:11.5px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:-16px;
    margin-bottom:24px;
  }
  .scan-note::before{ content:"◆"; color:var(--gold); font-size:8px; }

  /* Layers diagram */
  .layers-diagram{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:22px;
  }
  .layer-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
  }
  .layer-row .n{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:#fff;
    background:var(--sage);
    width:24px;height:24px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .layer-row.sub .n{ background:var(--gold); font-size:10.5px; }
  .layer-row.sub{ margin-left:26px; border-style:dashed; }
  .layer-row .t{ font-size:13.5px; }
  .layer-row .t small{ display:block; color:var(--ink-soft); font-size:11.5px; font-style:italic; }

  .desc-toggle{
    all:unset;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold);
    padding:4px 0 20px;
  }
  .desc-toggle .car{
    transition:transform .2s ease;
    font-size:9px;
  }
  .desc-toggle.open .car{ transform:rotate(90deg); }
  .menu-desc{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:400;
    font-size:15.5px;
    line-height:1.6;
    color:var(--sage-deep);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:16px 0;
    margin:-16px 0 24px;
  }
  .menu-desc.hidden{ display:none; }
  ol.steps li .routine-toggle{
    all:unset;
    cursor:pointer;
    display:inline;
    color:var(--sage-deep);
    text-decoration:underline;
    text-decoration-style:dashed;
    text-decoration-color:var(--gold);
    text-underline-offset:3px;
  }
  ol.steps li .routine-toggle .tap-hint{
    display:inline-block;
    margin-left:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:.04em;
    text-decoration:none;
    color:var(--gold);
    text-transform:uppercase;
  }
  .routine-panel{
    margin-top:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:4px 14px;
  }
  .routine-panel.hidden{ display:none; }
  .routine-row{
    display:flex;
    gap:10px;
    padding:11px 0;
    border-bottom:1px solid var(--line);
  }
  .routine-row:last-child{ border-bottom:none; }
  .routine-row .rn{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:#fff;
    background:var(--gold);
    width:20px;height:20px;
    border-radius:50%;
    flex:none;
    display:flex;align-items:center;justify-content:center;
    margin-top:1px;
  }
  .routine-row .rt{ font-size:13.5px; line-height:1.45; }

const FACIAL_MASSAGE_ROUTINE = [
  {area:"Neck", detail:"Glide upward from collarbone to jaw, 3–5 times each side (opens lymphatic flow first)."},
  {area:"Jawline", detail:"Start at chin, sweep outward along jaw to ear, then behind earlobe and down neck. 3–5 times per side."},
  {area:"Cheeks", detail:"Long strokes from nose/mouth up toward temple, sweeping under the cheekbone. 5 times per side."},
  {area:"Under-eyes", detail:"Very light pressure, sweep from inner corner outward to temple. 3 times per side."},
  {area:"Brows", detail:"Glide from center of brow outward to temple, 45° angle. 5–10 times per side."},
  {area:"Forehead", detail:"From center outward toward hairline, or bottom to top. 5–10 times."}
];

const TIME_OPTIONS = (() => {
  const opts = [];
  for(let m = 6*60; m <= 21*60; m += 30){
    const h24 = Math.floor(m/60), min = m%60;
    const ampm = h24 < 12 ? 'AM' : 'PM';
    let h12 = h24 % 12; if(h12 === 0) h12 = 12;
    opts.push({value:m, label:`${h12}:${min.toString().padStart(2,'0')} ${ampm}`});
  }
  return opts;
})();

const SERVICE_OPTIONS = {
  "Massages":[
    "Nature's Healer Massage","Warm Bamboo Massage","Deep Tissue Massage",
    "Monet's Favorite Fragrance Massage","Mirbeau Signature Massage",
    "Men's Essential Massage","Mother-To-Be Massage","Just the Essentials Massage",
    "Ashiatsu Massage","Thai Massage"
  ],
  "Body Treatments":[
    "French Sea Detox","A Walk in the Forest","Impressionist Retreat",
    "Exotic Nourish Wrap","Mirbeau Signature Ritual","Mother-To-Be Body Polish"

};

const ROOM_OPTIONS = [
  "Room 0","Room 1","Room 2","Room 3","Room 4","Room 5","Room 6",
  "Lavender Room","Water Lilies Room","Monet Room"
];

const ENHANCEMENT_OPTIONS = {

function formatSlotTime(minutes){
  const h24 = Math.floor(minutes/60), min = minutes%60;
  const ampm = h24 < 12 ? 'AM' : 'PM';
  let h12 = h24 % 12; if(h12 === 0) h12 = 12;
  return `${h12}:${min.toString().padStart(2,'0')} ${ampm}`;
}

function buildSlots(startMin, endMin){
  const slots = [];
  let t = startMin;
  while(t + 50 <= endMin){
    slots.push({time:t, client:'', client2:'', service:'', enhancement:'', room:'', duration:50, hidden:false});
    t += 60;
  }
  return slots;
}

/* ---------- Paste-to-schedule parsing ---------- */

function timeStringToMinutes(t){
  const m = t.match(/(\d{1,2}):(\d{2})\s*([ap]m)/i);
  if(!m) return null;
  let h = parseInt(m[1],10);
  const min = parseInt(m[2],10);
  const ap = m[3].toLowerCase();
  if(ap === 'pm' && h !== 12) h += 12;
  if(ap === 'am' && h === 12) h = 0;
  return h*60 + min;
}

function parsePastedSchedule(text){
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const timeRangeRe = /^(\d{1,2}:\d{2}\s*[ap]m)\s*-\s*(\d{1,2}:\d{2}\s*[ap]m)$/i;
  const standaloneTimeRe = /^(\d{1,2}:\d{2}\s*[ap]m)$/i;
  const serviceLineRe = /^(.+?)\s+(\d+)\s*min$/i;

  const appointments = [];
  const standaloneLabels = [];

  for(let i=0; i<lines.length; i++){
    const line = lines[i];
    const rangeMatch = line.match(timeRangeRe);
    if(rangeMatch){
      const startMin = timeStringToMinutes(rangeMatch[1]);
      const endMin = timeStringToMinutes(rangeMatch[2]);
      const nameLine = lines[i+1];
      const serviceLine = lines[i+2];
      if(nameLine && serviceLine && startMin !== null && endMin !== null){
        const svcMatch = serviceLine.match(serviceLineRe);
        if(svcMatch){
          let dur = endMin - startMin;
          if(dur <= 0) dur += 24*60;
          appointments.push({
            startMin,
            duration: dur >= 75 ? 100 : 50,
            client: nameLine,
            serviceText: svcMatch[1].trim()
          });
          i += 2;
          continue;
        }
      }
    }
    if(standaloneTimeRe.test(line)){
      standaloneLabels.push(timeStringToMinutes(line));
    }
  }
  return { appointments, standaloneLabels };
}

const MATCH_STOPWORDS = new Set(['to','be','the','of','a','an','and']);

function normalizeServiceWords(str){
  return str.toLowerCase()
    .replace(/[-–—]/g, ' ')
    .replace(/[^a-z0-9\s]/g, '')
    .split(/\s+/)
    .filter(w => w && !MATCH_STOPWORDS.has(w));
}

function matchServiceName(extractedText){
  const extractedWords = normalizeServiceWords(extractedText);
  if(!extractedWords.length) return '';
  let best = '', bestScore = 0;
  Object.values(SERVICE_OPTIONS).flat().forEach(candidate => {
    const candWords = normalizeServiceWords(candidate);
    const overlap = extractedWords.filter(w => candWords.includes(w)).length;
    const score = overlap / extractedWords.length;
    if(score > bestScore){ bestScore = score; best = candidate; }
  });
  return bestScore >= 0.5 ? best : '';
}

function buildAgendaFromPastedText(text){
  const { appointments, standaloneLabels } = parsePastedSchedule(text);
  if(!appointments.length){
    alert("Couldn't find any appointments in that text. Make sure you copied the full schedule block, including times, names, and services.");
    return false;
  }

  const apptStarts = appointments.map(a => a.startMin);
  const start = Math.min(...apptStarts);

  let end = Math.max(...appointments.map(a => a.startMin + a.duration));
  end = Math.max(end, Math.max(...apptStarts) + 60);

  if(standaloneLabels.length){
    const maxLabel = Math.max(...standaloneLabels);
    let diff = (maxLabel - start) % 60;
    if(diff < 0) diff += 60;
    const aligned = diff === 0 ? maxLabel : maxLabel + (60 - diff);
    end = Math.max(end, aligned + 60);
  }

  const slots = buildSlots(start, end);
  let unmatchedCount = 0;

  appointments.forEach(appt => {
    const idx = slots.findIndex(s => s.time === appt.startMin);
    if(idx === -1) return;
    const matched = matchServiceName(appt.serviceText);
    if(!matched) unmatchedCount++;
    slots[idx].client = appt.client;
    slots[idx].service = matched;
    slots[idx].duration = appt.duration;
    if(appt.duration === 100 && slots[idx+1]){
      slots[idx+1].hidden = true;
    }
  });

  agenda.slots = slots;
  agenda.step = 'fill';
  saveAgendaState();

  if(unmatchedCount > 0){
    alert(`Imported ${appointments.length} appointment${appointments.length===1?'':'s'}. ${unmatchedCount} service${unmatchedCount===1?'':'s'} couldn't be auto-matched — please check and select manually.`);
  }
  return true;
}

const agenda = {
  step:'setup', // 'setup' | 'fill' | 'agenda'
  slots:[],
  timer:null
};

const AGENDA_STORAGE_KEY = 'spaAgendaState_v1';

function storageAvailable(){
  try{
    const testKey = '__storage_test__';
    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);
    return true;
  }catch(e){
    return false;
  }
}

const STORAGE_OK = storageAvailable();

function saveAgendaState(){
  try{
    localStorage.setItem(AGENDA_STORAGE_KEY, JSON.stringify({
      step: agenda.step,
      slots: agenda.slots
    }));
  }catch(e){ /* storage unavailable — continue without persistence */ }
}

function restoreAgendaState(){
  try{
    const raw = localStorage.getItem(AGENDA_STORAGE_KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(parsed && Array.isArray(parsed.slots) && parsed.slots.length){
      agenda.slots = parsed.slots;
      agenda.step = (parsed.step === 'fill' || parsed.step === 'agenda') ? parsed.step : 'fill';
    }
  }catch(e){ /* corrupt or unavailable storage — start fresh */ }
}

restoreAgendaState();

function openDetail(id){
  const item = ALL.find(i => i.id === id);
  if(!item) return;

  let html = `
    <button class="back-btn" id="back-btn"><span class="chev">←</span> All treatments</button>
    <h2>${item.name}</h2>
    <p class="caption">${item.caption}</p>
  `;

  if(item.menuDescription){
    html += `<button class="desc-toggle" id="desc-toggle"><span class="car">▸</span> See description</button>`;
    html += `<p class="menu-desc hidden" id="desc-panel">${item.menuDescription}</p>`;
  }

  if(item.callouts){
    html += item.callouts.map(c => `<div class="callout">${c}</div>`).join('');
  }
  if(item.scanNote){
    html += `<div class="scan-note">${item.scanNote}</div>`;
  }

  if(item.prep){
    html += `<div class="block-label">Prep</div><ul class="tray">`;
    html += item.prep.map(p => `<li>${p.t}${p.note ? `<span class="note">${p.note}</span>` : ''}</li>`).join('');
    html += `</ul>`;
  }

  if(item.tableMakeup){
    html += `<div class="block-label">Table Make Up</div><div class="layers-diagram">`;
    html += item.tableMakeup.map((t,idx) => `
      <div class="layer-row">
        <span class="n">${idx+1}</span>
        <span class="t">${t}</span>
      </div>
    `).join('');
    html += `</div>`;
  }

  if(item.tableLinens){
    html += `<div class="block-label">Table Linens</div><ul class="tray">`;
    html += item.tableLinens.map(t => `<li>${t}</li>`).join('');
    html += `</ul>`;
  }

  if(item.layers){
    html += `<div class="block-label">Layer Order</div><div class="layers-diagram">`;
    html += item.layers.map(l => `
      <div class="layer-row ${l.sub ? 'sub' : ''}">
        <span class="n">${l.n}</span>
        <span class="t">${l.t}${l.note ? `<small>${l.note}</small>` : ''}</span>
      </div>
    `).join('');
    html += `</div>`;
  }

  if(item.steps){
    html += `<div class="block-label">Steps</div><ol class="steps">`;
    html += item.steps.map((s,idx) => {
      if(s === "Perform Facial Massage"){
        const panelId = `routine-${item.id}-${idx}`;
        const routineRows = FACIAL_MASSAGE_ROUTINE.map((r,ri) => `
          <div class="routine-row">
            <span class="rn">${ri+1}</span>
            <span class="rt"><b>${r.area}</b> — ${r.detail}</span>
          </div>
        `).join('');
        return `<li><span class="num">${idx+1}</span>
          <button class="routine-toggle" data-target="${panelId}">Perform Facial Massage <span class="tap-hint">Tap for routine</span></button>
          <div class="routine-panel hidden" id="${panelId}">${routineRows}</div>
        </li>`;
      }
      return `<li><span class="num">${idx+1}</span>${s}</li>`;
    }).join('');
    html += `</ol>`;
  }

  detailInner.innerHTML = html;
  detail.classList.add('open');
  document.getElementById('back-btn').addEventListener('click', closeDetail);
  const descToggle = document.getElementById('desc-toggle');
  if(descToggle){
    descToggle.addEventListener('click', ()=>{
      document.getElementById('desc-panel').classList.toggle('hidden');
      descToggle.classList.toggle('open');
      descToggle.lastChild.textContent = descToggle.classList.contains('open') ? ' Hide description' : ' See description';
    });

    btn.addEventListener('click', ()=>{
      const panel = document.getElementById(btn.dataset.target);
      if(panel) panel.classList.toggle('hidden');
    });
  });
  detail.scrollTop = 0;

function renderAgendaFill(){
  const rows = agenda.slots.map((slot, idx) => {

    return `
    <div class="slot-row">
      <div class="slot-time-row">
        <div class="slot-time">${formatSlotTime(slot.time)}</div>
        <div class="slot-time-controls">
          <div class="duration-toggle ${slot.duration===100?'on-100':''}" data-idx="${idx}">
            <div class="dur-thumb"></div>
            <span class="dur-opt ${slot.duration===50?'active':''}">50 min</span>
            <span class="dur-opt ${slot.duration===100?'active':''}">100 min</span>
          </div>
          <button class="remove-slot-btn" data-idx="${idx}" title="Remove this appointment time" aria-label="Remove this appointment time">✕</button>
        </div>
      </div>

      <select data-idx="${idx}" class="agenda-room-select">${roomOptionsHtml(slot.room)}</select>
      <select data-idx="${idx}" class="agenda-service-select">${serviceOptionsHtml(slot.service)}</select>
      <select data-idx="${idx}" class="agenda-enhancement-select">${enhancementOptionsHtml(slot.enhancement)}</select>
    </div>
  `;
  }).join('');

  const usedTimes = new Set(agenda.slots.map(s => s.time));
  const availableTimeOpts = TIME_OPTIONS.filter(o => !usedTimes.has(o.value));
  const addTimeOptsHtml = availableTimeOpts.length
    ? availableTimeOpts.map(o => `<option value="${o.value}">${o.label}</option>`).join('')
    : `<option value="">No more times available</option>`;

  agendaInner.innerHTML = `
    <button class="back-btn" id="agenda-back"><span class="chev">←</span> Agenda Setup</button>
    <div class="agenda-step">
      <h2>Today's Schedule</h2>
      <p class="caption">Enter the client name and service for each appointment. Switch to 100 min for a longer appointment — it will absorb the next open slot.</p>
      ${storageWarningHtml()}
      ${rows}
      <div class="add-time-row">
        <select id="agenda-add-time-select">${addTimeOptsHtml}</select>
        <button class="ghost-btn add-time-btn" id="agenda-add-time-btn" ${availableTimeOpts.length ? '' : 'disabled'}>+ Add Appointment Time</button>
      </div>
      <button class="primary-btn" id="agenda-finish">Finish</button>
    </div>
  `;
  document.getElementById('agenda-back').addEventListener('click', ()=>{
    agenda.step = 'setup';
    renderAgenda();
  });
  agendaInner.querySelectorAll('.agenda-client-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      agenda.slots[parseInt(inp.dataset.idx,10)].client = inp.value;
      saveAgendaState();
    });
  });
  agendaInner.querySelectorAll('.agenda-client2-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      agenda.slots[parseInt(inp.dataset.idx,10)].client2 = inp.value;
      saveAgendaState();
    });
  });
  agendaInner.querySelectorAll('.agenda-room-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      agenda.slots[parseInt(sel.dataset.idx,10)].room = sel.value;
      saveAgendaState();
    });
  });
  agendaInner.querySelectorAll('.agenda-service-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const idx = parseInt(sel.dataset.idx,10);
      agenda.slots[idx].service = sel.value;
      if(!isCouplesService(sel.value)){
        agenda.slots[idx].client2 = '';
      }
      saveAgendaState();
      renderAgendaFill();
    });
  });
  agendaInner.querySelectorAll('.agenda-enhancement-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      agenda.slots[parseInt(sel.dataset.idx,10)].enhancement = sel.value;
      saveAgendaState();
    });
  });
  agendaInner.querySelectorAll('.duration-toggle').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.dataset.idx,10);
      const newDur = agenda.slots[idx].duration === 100 ? 50 : 100;
      setSlotDuration(idx, newDur);
      saveAgendaState();
      renderAgendaFill();
    });
  });
  agendaInner.querySelectorAll('.remove-slot-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.idx,10);
      removeSlot(idx);
      saveAgendaState();
      renderAgendaFill();
    });
  });
  document.getElementById('agenda-add-time-btn').addEventListener('click', ()=>{
    const select = document.getElementById('agenda-add-time-select');
    const val = select.value;
    if(!val) return;
    addSlotAtTime(parseInt(val,10));
    saveAgendaState();
    renderAgendaFill();
  });
  document.getElementById('agenda-finish').addEventListener('click', ()=>{
    agenda.step = 'agenda';
    saveAgendaState();
    renderAgenda();
  });
}

function removeSlot(idx){
  const removed = agenda.slots[idx];
  const hasData = removed.client || removed.client2 || removed.service;
  if(hasData && !confirm(`Remove the ${formatSlotTime(removed.time)} appointment? This will clear its entered info.`)){
    return;
  }
  agenda.slots.splice(idx, 1);
  // If the removed slot was a 100-min appointment, un-hide the slot it had absorbed
  if(removed.duration === 100 && agenda.slots[idx] && agenda.slots[idx].hidden){
    agenda.slots[idx].hidden = false;
    agenda.slots[idx].client = '';
    agenda.slots[idx].client2 = '';
    agenda.slots[idx].service = '';
    agenda.slots[idx].enhancement = '';
    agenda.slots[idx].room = '';
    agenda.slots[idx].duration = 50;
  }
}

function addSlotAtTime(timeMin){
  const newSlot = {time:timeMin, client:'', client2:'', service:'', enhancement:'', room:'', duration:50, hidden:false};
  let insertAt = agenda.slots.findIndex(s => s.time > timeMin);
  if(insertAt === -1) insertAt = agenda.slots.length;
  agenda.slots.splice(insertAt, 0, newSlot);
}

function setSlotDuration(idx, dur){
  const slot = agenda.slots[idx];
  const next = agenda.slots[idx+1];
  slot.duration = dur;
  if(dur === 100){
    if(next){ next.hidden = true; }
  } else {
    if(next){
      next.hidden = false;
      next.client = '';
      next.client2 = '';
      next.service = '';
      next.enhancement = '';
      next.room = '';
      next.duration = 50;
    }
  }
}

function currentMinutesNow(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}

    agenda.slots = [];
    agenda.step = 'setup';
    try{ localStorage.removeItem(AGENDA_STORAGE_KEY); }catch(e){}
    renderAgenda();
  });

  updateAgendaLive();
  agenda.timer = setInterval(updateAgendaLive, 30000);
}

function updateAgendaLive(){
  const nowNextEl = document.getElementById('agenda-now-next');
  const listEl = document.getElementById('agenda-list');
  if(!nowNextEl || !listEl) return;

  const nowMin = currentMinutesNow();
  const visible = agenda.slots.filter(s => !s.hidden);
  const current = visible.find(s => nowMin >= s.time && nowMin < s.time + s.duration);
  const next = visible.find(s => s.time > (current ? current.time : nowMin - 1));

  function nnCardHtml(label, slot, cls){
    if(!slot){
      return `<div class="nn-card ${cls}"><div class="nn-label">${label}</div><div class="nn-empty">No appointment</div></div>`;
    }
    const svcLine = [slot.service, slot.enhancement].filter(Boolean).join(' + ');
    const clientLine = [slot.client, slot.client2].filter(Boolean).join(' & ') || 'Open';
    return `<div class="nn-card ${cls}">
      <div class="nn-label">${label}</div>
      <div class="nn-client">${clientLine}</div>
      <div class="nn-service">${svcLine || '—'}</div>
      <div class="nn-time">${formatSlotTime(slot.time)}${slot.room ? ' · ' + slot.room : ''}</div>
    </div>`;
  }

  nowNextEl.innerHTML = nnCardHtml('Now', current, 'now') + nnCardHtml('Next', next, 'next');

  listEl.innerHTML = visible.map(s => {
    const svcLine = [s.service, s.enhancement].filter(Boolean).join(' + ');
    const clientLine = [s.client, s.client2].filter(Boolean).join(' & ') || 'Open';
    return `
    <div class="agenda-row ${current && s.time===current.time ? 'current' : ''}">
      <span class="ar-time">${formatSlotTime(s.time)}</span>
      <span class="ar-client">${clientLine}${s.room ? `<span class="ar-room">${s.room}</span>` : ''}</span>
      <span class="ar-service">${svcLine || '—'}</span>
    </div>
  `;
  }).join('');
}
</script>
